apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Release signing reads CI credentials directly from the environment, falling
// back to the gitignored android/keystore.properties for local builds. When
// neither is configured the release build stays unsigned, so debug builds and
// CI checks that never sign still run.
def androidKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def androidKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def androidKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def androidKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def environmentSigningConfigured = [androidKeystorePath, androidKeystorePassword, androidKeyAlias, androidKeyPassword].every { it }
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def localSigningConfigured = !environmentSigningConfigured && keystorePropertiesFile.exists()
if (localSigningConfigured) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseSigningConfigured = environmentSigningConfigured || localSigningConfigured

// Release builds take their version from these properties. AGP dropped the
// android.injected.version.* convention in 7.3, so fastlane passes our own
// names instead. Debug and local builds run without them and keep the
// placeholders.
def cueVersionCode = (project.findProperty("cueVersionCode") ?: "1").toInteger()
def cueVersionName = project.findProperty("cueVersionName") ?: "1.0"

android {
    namespace = "app.cuetracker"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.cuetracker"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode cueVersionCode
        versionName cueVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(environmentSigningConfigured ? androidKeystorePath : keystoreProperties['storeFile'])
                storePassword environmentSigningConfigured ? androidKeystorePassword : keystoreProperties['storePassword']
                keyAlias environmentSigningConfigured ? androidKeyAlias : keystoreProperties['keyAlias']
                keyPassword environmentSigningConfigured ? androidKeyPassword : keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
