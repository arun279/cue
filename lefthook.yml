prepare-commit-msg:
  commands:
    refuse-amend:
      # Git passes $2="commit" and $3="HEAD" only for `--amend`; -c/-C and
      # cherry-pick share source="commit" but pass a real ref SHA. Reviewed
      # commits get a new commit on top, not a rewrite. Override: ALLOW_AMEND=1.
      run: |
        if [ "{2}" = "commit" ] && [ "{3}" = "HEAD" ]; then
          if [ "$ALLOW_AMEND" != "1" ]; then
            echo ""
            echo "✗ git commit --amend is blocked by lefthook. Make a new commit instead."
            echo "  Override (unpushed local typo only): ALLOW_AMEND=1 git commit --amend ..."
            echo ""
            exit 1
          fi
        fi

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc}"
      run: pnpm biome check --staged --no-errors-on-unmatched --write {staged_files}
      stage_fixed: true
    dprint:
      glob: "*.{md,yml,yaml}"
      # --allow-no-files mirrors biome's --no-errors-on-unmatched above: when the
      # staged files all fall under dprint.json's excludes (ios/**, android/**),
      # dprint would otherwise exit 14 ("no files") and fail the commit.
      run: pnpm exec dprint check --allow-no-files {staged_files}
    cspell:
      glob: "*.{ts,tsx,css,md}"
      run: pnpm exec cspell --no-progress --no-must-find-files {staged_files}
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm typecheck

pre-push:
  piped: true
  commands:
    refuse-force-push:
      priority: 1
      # Best-effort only: $PPID normally identifies lefthook rather than git, so
      # this process check can miss force pushes. Server-side branch protection
      # is the real guard. Override: ALLOW_FORCE_PUSH=1.
      run: |
        cmd=$(ps -ocommand= -p $PPID 2>/dev/null || true)
        if echo "$cmd" | grep -qE -- '(--force|--force-with-lease|(^| )-f( |$))'; then
          if [ "$ALLOW_FORCE_PUSH" != "1" ]; then
            echo ""
            echo "✗ force-push is blocked by lefthook. Make a new commit on top instead."
            echo "  Override (your own branch, no reviewers): ALLOW_FORCE_PUSH=1 git push --force ..."
            echo ""
            exit 1
          fi
        fi
    check:
      priority: 2
      run: pnpm check
    # TODO: restore the e2e command here once WebKit is reliable on this machine.
    #   e2e:
    #     priority: 3
    #     run: pnpm e2e
    #
    # It was removed, not weakened away: ci.yml runs the same suite on ubuntu for
    # every pull request, and ruleset 18841630 requires the `e2e` context from
    # GitHub Actions, so a commit still cannot reach main without it passing.
    # What is lost locally is only the earlier signal.
    #
    # Why it had to go: Playwright WebKit on this Apple Virtualization guest
    # stalls a hard 15.00s per new WebKit process inside IOServiceOpen against
    # AppleVideoToolboxParavirtualizationDriver, whose backend lives in the host.
    # Measured 2026-07-27: launch 0.11s, newPage 30.10s, goto 15.02s; the suite
    # went from 294 passed in 3.4 minutes to 258 passed / 36 failed in 22.2
    # minutes. A reboot clears it for only 3 to 4 hours, so it is not a fix, and
    # there is no sudo here to reset the driver any other way.
    #
    # Restore when either is true: the paravirtualisation fault is gone for good,
    # or a WebKit preference is found that skips the VP9 hardware-decode probe
    # that triggers it. Verify with a timing probe first, importing webkit from
    # "@playwright/test": healthy newPage is sub-second, broken is 15s.
