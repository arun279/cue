appId: app.cuetracker
env:
  CAPTURE_AUTH: "false"
---
- runFlow: ../flows/up-next-mark-and-undo.yaml
# XCTest's synthesized drag does not open a swipeable row on the iOS simulator.
- runFlow:
    file: ../flows/swipe-mark-and-stop.yaml
    when:
      platform: Android
- runFlow: ../flows/show-detail-bulk-mark.yaml
- runFlow: ../flows/navigation-round-trips.yaml
- runFlow: ../flows/account.yaml
