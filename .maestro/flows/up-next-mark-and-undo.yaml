appId: app.cuetracker
---
- runFlow: lib/connect.yaml
- assertVisible:
    id: "up-next-list"
- waitForAnimationToEnd
- takeScreenshot: up-next-queue-rest
- copyTextFrom:
    id: "queue-row-[0-9]+-mark"
    index: 0
- evalScript: ${output.markLabel = maestro.copiedText}
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- tapOn:
    id: "queue-row-[0-9]+-mark"
    index: 0
- runFlow: lib/settle.yaml
- assertVisible:
    id: "snackbar-undo"
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- tapOn:
    id: "snackbar-undo"
- runFlow: lib/settle.yaml
- assertNotVisible:
    id: "snackbar-undo"
- assertVisible:
    id: "queue-row-[0-9]+-mark"
    text: ${output.markLabel}
- waitForAnimationToEnd
- takeScreenshot: up-next-mark-restored
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- tapOn:
    id: "queue-row-[0-9]+-mark"
    index: 0
- runFlow: lib/settle.yaml
- assertVisible:
    id: "snackbar-undo"
- waitForAnimationToEnd
- takeScreenshot: up-next-mark-snackbar
