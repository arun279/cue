# Mark the head of the queue, take it back, and mark it again. Android swipes the
# row; XCTest's synthesized drag does not open a swipeable row on the iOS
# simulator, so iOS marks from the row's long-press menu, which is the path a
# reader who does not swipe takes there.
appId: app.cuetracker
---
- runFlow: lib/connect.yaml
- assertVisible:
    id: "up-next-list"
- waitForAnimationToEnd
- takeScreenshot: up-next-queue-rest
- copyTextFrom:
    id: "queue-row-[0-9]+-body"
    index: 0
- evalScript: ${output.rowLabel = maestro.copiedText}
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          from:
            id: "queue-row-[0-9]+"
            index: 0
          direction: RIGHT
- runFlow:
    when:
      platform: iOS
    commands:
      - longPressOn:
          id: "queue-row-[0-9]+-body"
          index: 0
      - tapOn: "Mark .* watched"
- runFlow: lib/settle.yaml
- assertVisible:
    id: "snackbar-undo"
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- tapOn:
    id: "snackbar-undo"
- runFlow: lib/settle.yaml
- assertNotVisible:
    id: "snackbar-undo"
- assertVisible:
    id: "queue-row-[0-9]+-body"
    text: ${output.rowLabel}
- waitForAnimationToEnd
- takeScreenshot: up-next-mark-restored
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          from:
            id: "queue-row-[0-9]+"
            index: 0
          direction: RIGHT
- runFlow:
    when:
      platform: iOS
    commands:
      - longPressOn:
          id: "queue-row-[0-9]+-body"
          index: 0
      - tapOn: "Mark .* watched"
- runFlow: lib/settle.yaml
- assertVisible:
    id: "snackbar-undo"
- waitForAnimationToEnd
- takeScreenshot: up-next-mark-snackbar
