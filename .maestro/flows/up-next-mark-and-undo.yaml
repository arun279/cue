# Mark the head of the queue, take it back, and mark it again. Android swipes the
# row; XCTest's synthesized drag does not open a swipeable row on the iOS
# simulator, so iOS opens the row and marks from show detail's check, the
# control every row leads to.
appId: app.cuetracker
---
- runFlow: lib/connect.yaml
- assertVisible:
    id: "up-next-list"
- waitForAnimationToEnd
- takeScreenshot: up-next-queue-rest
- copyTextFrom:
    id: "queue-row-[0-9]+-body"
    index: 0
- evalScript: ${output.rowLabel = maestro.copiedText}
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          from:
            id: "queue-row-[0-9]+"
            index: 0
          direction: RIGHT
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "queue-row-[0-9]+-body"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "continue-mark"
          timeout: 30000
      - tapOn:
          id: "continue-mark"
- runFlow: lib/settle.yaml
- assertVisible:
    id: "snackbar-undo"
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- tapOn:
    id: "snackbar-undo"
- runFlow: lib/settle.yaml
- assertNotVisible:
    id: "snackbar-undo"
- runFlow:
    file: lib/back.yaml
    when:
      platform: iOS
    env:
      BACK_TITLE: "Up Next"
- assertVisible:
    id: "queue-row-[0-9]+-body"
    text: ${output.rowLabel}
- waitForAnimationToEnd
- takeScreenshot: up-next-mark-restored
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          from:
            id: "queue-row-[0-9]+"
            index: 0
          direction: RIGHT
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "queue-row-[0-9]+-body"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "continue-mark"
          timeout: 30000
      - tapOn:
          id: "continue-mark"
- runFlow: lib/settle.yaml
- assertVisible:
    id: "snackbar-undo"
# Show detail's check names the marked episode for five seconds, and on iOS the
# steps above can take longer than that, so the capture waits for the card to
# move on to the next episode. The harness keeps the Undo snackbar up, so the
# screen is the same on every run.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: "continue-mark"
            text: "Mark .* watched"
          timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: up-next-mark-snackbar
