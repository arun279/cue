appId: app.cuetracker
---
- runScript: lib/reset-fake.js
- assertTrue: ${output.fakeReset}
- runFlow: lib/connect.yaml
- assertVisible: "Up Next"
- assertVisible: "Library"
- assertVisible: "Calendar"
- assertVisible: "Search"
- tapOn: "Library"
- assertVisible:
    id: "screen-library"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: library-tab-rest
- tapOn: "Calendar"
- assertVisible:
    id: "screen-calendar"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: calendar-rest
- tapOn: "Search"
- assertVisible:
    id: "screen-search"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: search-empty
# On iOS the selected search tab folds the other tabs into one button named for
# the tab it returns to, so the way back to Up Next goes through Calendar.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Calendar"
      - assertVisible:
          id: "screen-calendar"
- tapOn: "Up Next"
- assertVisible:
    id: "screen-up-next"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: up-next-tab-rest
