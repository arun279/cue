appId: app.cuetracker
---
- runScript: lib/reset-fake.js
- assertTrue: ${output.fakeReset}
- runFlow: lib/connect.yaml
- assertVisible: "Up Next"
- assertVisible: "Library"
- assertVisible: "Calendar"
- assertVisible: "Search"
- tapOn:
    id: "tab-library"
- assertVisible:
    id: "screen-library"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: library-tab-rest
- tapOn:
    id: "tab-calendar"
- assertVisible:
    id: "screen-calendar"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: calendar-rest
- tapOn:
    id: "tab-search"
- assertVisible:
    id: "screen-search"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: search-empty
- tapOn:
    id: "tab-up-next"
- assertVisible:
    id: "screen-up-next"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: up-next-tab-rest
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: up-next-returning-user
