appId: app.cuetracker
---
- runScript: lib/reset-fake.js
- assertTrue: ${output.fakeReset}
- runFlow: lib/connect.yaml
- assertVisible: "Up Next"
- assertVisible: "Library"
- assertVisible: "Calendar"
- assertVisible: "Search"
- tapOn: "Library"
- assertVisible:
    id: "screen-library"
- takeScreenshot: "${SCREENSHOT_DIR}/library-tab-rest"
- tapOn: "Calendar"
- assertVisible:
    id: "screen-calendar"
- takeScreenshot: "${SCREENSHOT_DIR}/calendar-empty"
- tapOn: "Search"
- assertVisible:
    id: "screen-search"
- takeScreenshot: "${SCREENSHOT_DIR}/search-empty"
- tapOn: "Up Next"
- assertVisible:
    id: "screen-up-next"
- takeScreenshot: "${SCREENSHOT_DIR}/up-next-tab-rest"
- takeScreenshot: "${SCREENSHOT_DIR}/up-next-returning-user"
