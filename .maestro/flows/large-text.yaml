appId: app.cuetracker
---
- launchApp:
    permissions: {}
    arguments:
      UIPreferredContentSizeCategoryName: ${CONTENT_SIZE}
- extendedWaitUntil:
    visible:
      id: "screen-up-next"
    timeout: 30000
- tapOn: "Library"
- extendedWaitUntil:
    visible:
      id: "screen-library"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: library-${SIZE}
- tapOn: "Search"
- extendedWaitUntil:
    visible:
      id: "screen-search"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: search-${SIZE}
- tapOn: "Library"
- tapOn:
    id: "avatar-link"
- scrollUntilVisible:
    element:
      id: "profile-stat-shows"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: profile-${SIZE}
- scrollUntilVisible:
    element:
      id: "profile-to-history"
- tapOn:
    id: "profile-to-history"
- scrollUntilVisible:
    element:
      id: "history-jump"
- tapOn:
    id: "history-jump"
- assertVisible:
    id: "history-jump-sheet"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: history-jump-${SIZE}
