appId: app.cuetracker
---
- launchApp:
    permissions: {}
    arguments:
      UIPreferredContentSizeCategoryName: ${CONTENT_SIZE}
- extendedWaitUntil:
    visible:
      id: "screen-up-next"
    timeout: 30000
- tapOn: "Library"
- extendedWaitUntil:
    visible:
      id: "screen-library"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: library-shows-${SIZE}
- tapOn:
    id: "avatar-link"
- scrollUntilVisible:
    element:
      id: "profile-stat-shows"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: profile-rest-${SIZE}
- tapOn:
    id: "close-account"
- tapOn: "Search"
- extendedWaitUntil:
    visible:
      id: "screen-search"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: search-empty-${SIZE}
