appId: app.cuetracker
---
- launchApp:
    permissions: {}
    arguments:
      UIPreferredContentSizeCategoryName: ${CONTENT_SIZE}
- extendedWaitUntil:
    visible:
      id: "screen-up-next"
    timeout: 30000
- tapOn: "Library"
- extendedWaitUntil:
    visible:
      id: "screen-library"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: library-shows-${SIZE}
- tapOn:
    id: "avatar-link"
- runFlow: lib/scroll-to-end.yaml
- takeScreenshot: profile-rest-${SIZE}
- runFlow: lib/leave-profile.yaml
# Library's header search field carries a "Search" glyph of its own, so the
# Search tab is reached from Calendar, where the tab bar's is the only one.
- tapOn: "Calendar"
- extendedWaitUntil:
    visible:
      id: "screen-calendar"
    timeout: 30000
- tapOn: "Search"
- extendedWaitUntil:
    visible:
      id: "screen-search"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: search-empty-${SIZE}
