appId: app.cuetracker
---
- runFlow: lib/relaunch.yaml
- tapOn: "Library"
- tapOn:
    id: "library-segment-movies"
- tapOn:
    id: "library-chip-watched"
- tapOn:
    id: "movie-card-5501"
- assertVisible:
    id: "screen-movie-detail"
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- tapOn:
    id: "movie-mark"
- assertVisible: "Removed play"
- runFlow: lib/settle.yaml
- assertVisible: "Not watched yet"
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- tapOn:
    id: "movie-mark"
- runFlow: lib/settle.yaml
- assertVisible:
    id: "snackbar-undo"
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- tapOn:
    id: "snackbar-undo"
- runFlow: lib/settle.yaml
- assertVisible: "Not watched yet"
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- tapOn: "More actions for The Lantern Keeper"
- assertVisible: "Add to Watchlist"
- assertVisible: "Open on Trakt"
- tapOn: "Add to Watchlist"
- runFlow: lib/settle.yaml
- assertVisible: "In Watchlist"
- takeScreenshot: movie-detail-in-watchlist
- scrollUntilVisible:
    element:
      text: "More like this"
    direction: DOWN
    centerElement: true
- assertVisible:
    id: "movie-card-5502"
- assertNotVisible:
    id: "movie-card-5508"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Library"
          index: 0
- runFlow:
    when:
      platform: Android
    commands:
      - back
- assertVisible:
    id: "screen-library"
- assertVisible:
    id: "library-chip-watched"
- assertNotVisible:
    id: "library-chip-watching"
