# The two swipes, and the short one that commits nothing.
#
# The short case is the one a native gesture implementation is most likely to
# break, and it is the only assertion here coupled to screen geometry: Maestro
# cannot combine a direction with explicit coordinates, so a partial drag has to
# name them. The full swipes drag for 1.5 s: the default 0.4 s drag from the
# row's centre opened the row on Android but not on the iOS simulator.
appId: app.cuetracker
---
- runFlow: lib/relaunch.yaml
- swipe:
    from:
      id: "queue-row-[0-9]+"
      index: 0
    direction: RIGHT
    duration: 1500
- assertVisible:
    id: "snackbar"
- tapOn:
    id: "snackbar-undo"
- runFlow: lib/settle.yaml
- swipe:
    start: "10%, 46%"
    end: "22%, 46%"
- assertNotVisible:
    id: "snackbar"
- swipe:
    from:
      id: "queue-row-[0-9]+"
      index: 0
    direction: LEFT
    duration: 1500
- assertVisible:
    id: "snackbar"
- tapOn:
    id: "snackbar-undo"
- runFlow: lib/settle.yaml
