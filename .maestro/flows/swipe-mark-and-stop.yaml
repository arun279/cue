# The two swipes, and the short one that commits nothing.
#
# The short case is the one a native gesture implementation is most likely to
# break, and it is the only assertion here coupled to screen geometry: Maestro
# cannot combine a direction with explicit coordinates, so a partial drag has to
# name them.
appId: app.cuetracker
---
- runFlow: lib/relaunch.yaml
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- swipe:
    from:
      id: "queue-row-[0-9]+"
      index: 0
    direction: RIGHT
- runFlow: lib/settle.yaml
- assertVisible:
    id: "snackbar-undo"
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- tapOn:
    id: "snackbar-undo"
- runFlow: lib/settle.yaml
- swipe:
    start: "10%, 46%"
    end: "22%, 46%"
- assertNotVisible:
    id: "snackbar"
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- swipe:
    from:
      id: "queue-row-[0-9]+"
      index: 0
    direction: LEFT
- runFlow: lib/settle.yaml
- assertVisible:
    id: "snackbar-undo"
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- tapOn:
    id: "snackbar-undo"
- runFlow: lib/settle.yaml
