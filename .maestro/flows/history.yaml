appId: app.cuetracker
---
- runScript: lib/reset-fake.js
- assertTrue: ${output.fakeReset}
- runFlow: lib/connect.yaml
- tapOn:
    id: "avatar-link"
- tapOn:
    id: "profile-to-history"
- assertVisible:
    id: "screen-history"
- assertVisible:
    id: "history-day-header-0"
- copyTextFrom:
    id: "history-day-header-0"
- evalScript: ${output.historyDay = maestro.copiedText}
- assertVisible:
    id: "history-row-0"
- assertVisible:
    id: "history-row-0"
    text: ".*, 2 plays"
- tapOn:
    id: "history-row-0-check"
- assertVisible:
    id: "snackbar"
- tapOn:
    id: "snackbar-undo"
- assertVisible:
    text: ${output.historyDay}
- assertVisible:
    id: "history-row-0"
# Android collapses the header search field into a toolbar icon.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Search"
          rightOf:
            id: "sync-now"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Filter by title"
- inputText: "zzzznomatch"
- assertVisible: "No titles match."
- eraseText
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Clear query"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "(?i)close|cancel"
- assertVisible:
    id: "history-row-0"
- tapOn:
    id: "history-jump"
- assertVisible:
    id: "history-jump-sheet"
- tapOn:
    id: "history-jump-month-8"
- assertVisible:
    id: "screen-history"
- waitForAnimationToEnd
- takeScreenshot: history-month
