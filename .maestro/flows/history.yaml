appId: app.cuetracker
---
- runFlow: lib/relaunch.yaml
- tapOn:
    id: "avatar-link"
- tapOn:
    id: "profile-to-history"
- assertVisible:
    id: "screen-history"
- assertVisible:
    id: "history-day-header-0"
- copyTextFrom:
    id: "history-day-header-0"
- evalScript: ${output.historyDay = maestro.copiedText}
- assertVisible:
    id: "history-row-0"
- assertVisible:
    id: "history-row-0"
    text: ".*, 2 plays"
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
# One menu per row: iOS opens it by long press, Android from the row's more icon.
- runFlow:
    when:
      platform: iOS
    commands:
      - longPressOn:
          id: "history-row-0"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "history-row-0-menu"
- tapOn: "Remove this play"
- runFlow: lib/settle.yaml
- assertVisible:
    id: "snackbar-undo"
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- tapOn:
    id: "snackbar-undo"
- runFlow: lib/settle.yaml
- assertVisible:
    text: ${output.historyDay}
- assertVisible:
    id: "history-row-0"
- tapOn:
    id: "history-jump"
- extendedWaitUntil:
    visible:
      id: "sheet-presented"
    timeout: 10000
- assertVisible:
    id: "history-jump-sheet"
- waitForAnimationToEnd
- takeScreenshot: history-jump
# iOS closes the sheet from its close button; Android also has system back.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Close"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    notVisible:
      id: "history-jump-sheet"
    timeout: 10000
- assertVisible:
    id: "screen-history"
# Android collapses the header search field into a toolbar icon.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Search"
          rightOf:
            text: "History"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Filter by title"
- inputText: "zzzznomatch"
- assertVisible: "No titles match."
- eraseText
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Clear query"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "(?i)close|cancel"
      - extendedWaitUntil:
          notVisible: "(?i)close|cancel"
          timeout: 10000
- assertVisible:
    id: "history-row-0"
- tapOn:
    id: "history-jump"
- extendedWaitUntil:
    visible:
      id: "sheet-presented"
    timeout: 10000
- tapOn:
    id: "history-jump-month-8"
- extendedWaitUntil:
    notVisible:
      id: "history-jump-sheet"
    timeout: 10000
- assertVisible:
    id: "screen-history"
- waitForAnimationToEnd
- takeScreenshot: history-month
- runFlow:
    file: lib/back.yaml
    env:
      BACK_TITLE: "Profile"
- assertVisible:
    id: "screen-profile"
- runFlow: lib/leave-profile.yaml
- assertVisible:
    id: "screen-up-next"
