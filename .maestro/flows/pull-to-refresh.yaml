# Pull to refresh on the platform control, on Up Next and on History.
#
# The pull is the only manual refresh on these lists, so each pull has to start
# the sync pass and see it through; the receipts the harness publishes for that
# pass are what this waits on, which a spinner that never moved would not leave.
appId: app.cuetracker
---
- runFlow: lib/relaunch.yaml
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: sync
- swipe:
    start: "50%, 25%"
    end: "50%, 85%"
    duration: 600
- runFlow: lib/settle.yaml
- assertVisible:
    id: "up-next-list"
- tapOn:
    id: "avatar-link"
- tapOn:
    id: "profile-to-history"
- assertVisible:
    id: "history-row-0"
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: sync
- swipe:
    start: "50%, 40%"
    end: "50%, 90%"
    duration: 600
- runFlow: lib/settle.yaml
- assertVisible:
    id: "screen-history"
