# The Library screen end to end: both media, a chip, the filter, sort, and the
# tile that opens a show.
#
# The medium, the chip and the order are three separate choices over one grid,
# and each one has to survive the others. Filtering to nothing is the state that
# proves the grid is reading the settled query rather than every keystroke.
appId: app.cuetracker
---
- runScript: lib/reset-fake.js
- assertTrue: ${output.fakeReset}
- runFlow: lib/connect.yaml
- tapOn: "Library"
- assertVisible:
    id: "screen-library"
- assertVisible:
    id: "show-card-8801"
- takeScreenshot: "${SCREENSHOT_DIR}/library-shows"

- tapOn:
    id: "library-segment-movies"
- assertVisible:
    id: "movie-card-5503"
- tapOn:
    id: "library-chip-watched"
- assertVisible:
    id: "movie-card-5501"
- takeScreenshot: "${SCREENSHOT_DIR}/library-movies-watched"

- tapOn:
    id: "library-segment-shows"
- assertVisible:
    id: "show-card-8801"
- tapOn:
    id: "library-chip-stopped"
- assertVisible:
    id: "library-empty"
- takeScreenshot: "${SCREENSHOT_DIR}/library-empty-stopped"
- tapOn:
    id: "library-chip-watching"

- tapOn:
    id: "library-filter-toggle"
- inputText: "zzz"
- assertVisible:
    id: "library-no-match"
- takeScreenshot: "${SCREENSHOT_DIR}/library-no-match"
- tapOn:
    id: "library-filter-clear"
- assertVisible:
    id: "show-card-8801"

- tapOn:
    id: "library-sort"
- takeScreenshot: "${SCREENSHOT_DIR}/library-sort-menu"
- tapOn: "A-Z"
- assertVisible:
    id: "show-card-8801"

- tapOn:
    id: "show-card-8801"
- assertVisible:
    id: "screen-show-detail"
- takeScreenshot: "${SCREENSHOT_DIR}/show-detail-from-library"
