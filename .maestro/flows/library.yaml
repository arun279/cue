# The Library screen end to end: both media, a chip, the filter, sort, and the
# tile that opens a show.
#
# The medium, the chip and the order are three separate choices over one grid,
# and each one has to survive the others. Filtering to nothing is the state that
# proves the grid is reading the settled query rather than every keystroke.
appId: app.cuetracker
---
- runFlow: lib/relaunch.yaml
- tapOn: "Library"
- assertVisible:
    id: "screen-library"
- assertVisible:
    id: "show-card-8801"
- waitForAnimationToEnd
- takeScreenshot: library-shows
- waitForAnimationToEnd
- takeScreenshot: library-header

- tapOn:
    id: "library-segment-movies"
- assertVisible:
    id: "movie-card-5503"
- tapOn:
    id: "library-chip-watched"
- assertVisible:
    id: "movie-card-5501"
- waitForAnimationToEnd
- takeScreenshot: library-movies-watched

- tapOn:
    id: "library-segment-shows"
- assertVisible:
    id: "show-card-8801"
- tapOn:
    id: "library-chip-stopped"
- assertVisible:
    id: "library-empty"
- waitForAnimationToEnd
- takeScreenshot: library-empty-stopped
- tapOn:
    id: "library-chip-watching"

- tapOn:
    id: "library-filter-toggle"
- tapOn:
    id: "library-filter-field"
# One letter at a time, each after the screen settles: on a slow iOS simulator,
# letters typed in one burst after the first had emptied the grid never reached
# the field.
- inputText: "z"
- extendedWaitUntil:
    visible: 'No shows match "z".'
    timeout: 10000
- inputText: "z"
- extendedWaitUntil:
    visible: 'No shows match "zz".'
    timeout: 10000
- inputText: "z"
- extendedWaitUntil:
    visible: 'No shows match "zzz".'
    timeout: 10000
- pressKey: Enter
- waitForAnimationToEnd
- takeScreenshot: library-no-match
- tapOn:
    id: "library-filter-clear"
- assertVisible:
    id: "show-card-8801"

- tapOn:
    id: "library-sort"
- extendedWaitUntil:
    visible: "A-Z"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: library-sort-menu
- tapOn: "A-Z"
- assertVisible:
    id: "show-card-8801"

- tapOn:
    id: "show-card-8801"
- assertVisible:
    id: "screen-show-detail"
- waitForAnimationToEnd
- takeScreenshot: show-detail-from-library
