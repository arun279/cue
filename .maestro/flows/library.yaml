# The Library screen end to end: both media, a chip, the filter, sort, and the
# tile that opens a show.
#
# The medium, the chip and the order are three separate choices over one grid,
# and each one has to survive the others. Filtering to nothing is the state that
# proves the grid is reading the settled query rather than every keystroke.
appId: app.cuetracker
---
- runFlow: lib/relaunch.yaml
- tapOn: "Library"
- assertVisible:
    id: "screen-library"
- extendedWaitUntil:
    visible:
      id: "avatar-link"
    timeout: 30000
- assertVisible:
    id: "show-card-8801"
- waitForAnimationToEnd
- takeScreenshot: library-shows
- waitForAnimationToEnd
- takeScreenshot: library-header

- tapOn:
    id: "library-segment-movies"
- assertVisible:
    id: "movie-card-5503"
- tapOn:
    id: "library-chip-watched"
- assertVisible:
    id: "movie-card-5501"
- waitForAnimationToEnd
- takeScreenshot: library-movies-watched

- tapOn:
    id: "library-segment-shows"
- assertVisible:
    id: "show-card-8801"
- tapOn:
    id: "library-chip-stopped"
- assertVisible:
    id: "library-empty"
- waitForAnimationToEnd
- takeScreenshot: library-empty-stopped
- tapOn:
    id: "library-chip-watching"

# Android collapses the header search field into a toolbar icon; the tab bar's
# own Search sits below the grid.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Search"
          above:
            id: "library-grid"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Filter by title"
- inputText: "zzz"
- extendedWaitUntil:
    visible: 'No shows match "zzz".'
    timeout: 10000
# Search ends editing and dismisses the keyboard, shown by its delete key
# going. The search bar keeps its clear button after search.
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "(?i)delete"
- pressKey: Enter
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          notVisible: "(?i)delete"
          timeout: 10000
- assertVisible: 'No shows match "zzz".'
- waitForAnimationToEnd
- takeScreenshot: library-no-match
- tapOn:
    id: "library-filter-clear"
- assertVisible:
    id: "show-card-8801"

- tapOn:
    id: "library-sort"
- extendedWaitUntil:
    visible: "A-Z"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: library-sort-menu
- tapOn: "A-Z"
- assertVisible:
    id: "show-card-8801"

- tapOn:
    id: "show-card-8801"
- assertVisible:
    id: "screen-show-detail"
- extendedWaitUntil:
    visible: "More actions for Harbor Lights"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: show-detail-from-library
