appId: app.cuetracker
---
- runFlow: lib/relaunch.yaml
- tapOn:
    id: "queue-row-8803"
- extendedWaitUntil:
    visible: "More actions for Midnight Cartography"
    timeout: 30000
- tapOn: "S2 E3 · Half Measures.*"
- assertVisible:
    id: "episode-sheet"
- assertVisible:
    id: "episode-mark-row"
- waitForAnimationToEnd
- takeScreenshot: episode-sheet-rest
- waitForAnimationToEnd
- takeScreenshot: episode-sheet-open
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- tapOn:
    id: "episode-mark-control"
- assertVisible:
    id: "snackbar"
- runFlow: lib/settle.yaml
- assertVisible:
    id: "episode-sheet"
- waitForAnimationToEnd
- takeScreenshot: episode-sheet-marked
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- tapOn:
    id: "snackbar-undo"
- runFlow: lib/settle.yaml
- assertVisible: "Not watched yet"
- assertNotVisible:
    id: "snackbar"
- tapOn:
    id: "episode-pager-next"
- assertVisible:
    id: "episode-still-blur"
- waitForAnimationToEnd
- takeScreenshot: episode-sheet-spoiler
- tapOn:
    id: "episode-still-reveal"
- assertNotVisible:
    id: "episode-still-blur"
- waitForAnimationToEnd
- takeScreenshot: episode-sheet-revealed
- runFlow: lib/dismiss-episode-sheet.yaml
- assertVisible:
    id: "screen-show-detail"
- assertVisible: "More actions for Midnight Cartography"
- waitForAnimationToEnd
- takeScreenshot: show-detail-after-episode
- scrollUntilVisible:
    element:
      id: "episode-row-880308"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "episode-row-880308"
- assertVisible:
    id: "episode-sheet"
- extendedWaitUntil:
    visible:
      id: "sheet-presented"
    timeout: 10000
- tapOn: "Close"
- extendedWaitUntil:
    notVisible:
      id: "episode-sheet"
    timeout: 10000
- assertVisible:
    id: "screen-show-detail"
