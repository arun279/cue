appId: app.cuetracker
---
- runScript: lib/reset-fake.js
- assertTrue: ${output.fakeReset}
- runFlow: lib/connect.yaml
- tapOn:
    id: "queue-row-8803"
- scrollUntilVisible:
    element:
      id: "episode-row-880308"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "episode-row-880308"
- assertVisible:
    id: "episode-sheet"
- assertVisible:
    id: "episode-mark-row"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: episode-sheet-rest
- tapOn:
    id: "episode-mark-control"
- assertVisible:
    id: "snackbar"
- assertVisible:
    id: "episode-sheet"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: episode-sheet-marked
- tapOn:
    id: "episode-mark-control"
- runFlow: lib/settle.yaml
- assertVisible: "Not watched yet"
- tapOn:
    id: "episode-pager-next"
- assertVisible:
    id: "episode-still-blur"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: episode-sheet-spoiler
- tapOn:
    id: "episode-still-reveal"
- assertNotVisible:
    id: "episode-still-blur"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: episode-sheet-revealed
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "50%,55%"
          end: "50%,98%"
          duration: 300
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          start: "50%,10%"
          end: "50%,98%"
          duration: 500
- assertVisible:
    id: "screen-show-detail"
- assertNotVisible:
    id: "episode-sheet"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: show-detail-after-episode
