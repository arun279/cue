appId: app.cuetracker
---
- runFlow:
    file: lib/connect.yaml
    env:
      CAPTURE_AUTH: "true"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: up-next-populated
- tapOn:
    id: "queue-row-8803"
- extendedWaitUntil:
    visible:
      id: "screen-show-detail"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: show-detail-rest
- scrollUntilVisible:
    element:
      id: "episode-row-880308"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "episode-row-880308"
- extendedWaitUntil:
    visible:
      id: "episode-sheet"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: episode-sheet-rest
- runFlow: lib/dismiss-episode-sheet.yaml
- extendedWaitUntil:
    visible:
      id: "screen-show-detail"
    timeout: 30000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Up Next"
          index: 0
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions: {}
- extendedWaitUntil:
    visible:
      id: "screen-up-next"
    timeout: 30000
- tapOn: "Library"
- extendedWaitUntil:
    visible:
      id: "screen-library"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: library-shows
- tapOn:
    id: "avatar-link"
- scrollUntilVisible:
    element:
      id: "profile-stat-shows"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: profile-rest
- tapOn:
    id: "profile-to-settings"
- extendedWaitUntil:
    visible:
      id: "screen-settings"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: settings-rest
- runFlow:
    file: lib/back.yaml
    env:
      BACK_TITLE: "Profile"
- tapOn:
    id: "close-account"
- extendedWaitUntil:
    visible:
      id: "screen-library"
    timeout: 30000
- tapOn: "Calendar"
- extendedWaitUntil:
    visible:
      id: "screen-calendar"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: calendar-rest
- tapOn: "Search"
- extendedWaitUntil:
    visible:
      id: "screen-search"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: search-empty
# On iOS the selected search tab folds the other tabs into one button named for
# the tab it returns to, so the way back to Up Next goes through Calendar.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Calendar"
      - extendedWaitUntil:
          visible:
            id: "screen-calendar"
          timeout: 30000
- tapOn: "Up Next"
- extendedWaitUntil:
    visible:
      id: "screen-up-next"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: up-next-tab-rest
