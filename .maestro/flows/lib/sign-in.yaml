appId: app.cuetracker
---
# Wait for onboarding to acknowledge readiness. The timeout only guards hangs.
- extendedWaitUntil:
    visible:
      id: "onboarding-ready"
    timeout: 90000
- runFlow:
    when:
      true: ${CAPTURE_AUTH == "true"}
    commands:
      - waitForAnimationToEnd
      - takeScreenshot: onboarding-ready
- tapOn:
    id: "button-connect"
- copyTextFrom:
    id: "press-trace"
- evalScript: ${console.log('CUE_PRESS_TRACE=' + maestro.copiedText)}
- extendedWaitUntil:
    visible:
      id: "press-trace"
      text: ".*; press [+].*"
    timeout: 10000
    label: "Tap not delivered: Connect Trakt never pressed"
# The fake keeps the grant pending until the next step approves it, so the code
# screen waits here instead of passing by between two hierarchy reads.
- extendedWaitUntil:
    visible:
      id: "device-code-value"
    timeout: 30000
- runFlow:
    when:
      true: ${CAPTURE_AUTH == "true"}
    commands:
      - waitForAnimationToEnd
      - takeScreenshot: connect-code-ready
- runScript: approve-device.js
- assertTrue: ${output.deviceApproved}
- runFlow: ready.yaml
