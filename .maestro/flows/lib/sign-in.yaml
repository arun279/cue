appId: app.cuetracker
---
# Onboarding paints once the auth store has read the keychain, which a cold
# launch does not finish inside the default assertion window. Across 204 fresh
# installs in iOS CI runs from 2026-10-03 to 2026-10-08 the median was 7 s and
# the slowest took up to 52 s.
- extendedWaitUntil:
    visible:
      id: "screen-onboarding"
    timeout: 90000
- runFlow:
    when:
      true: ${CAPTURE_AUTH == "true"}
    commands:
      - waitForAnimationToEnd
      - takeScreenshot: onboarding-ready
- tapOn:
    id: "button-connect"
    waitToSettleTimeoutMs: 100
# The fake keeps the grant pending until the next step approves it, so the code
# screen waits here instead of passing by between two hierarchy reads.
- extendedWaitUntil:
    visible:
      id: "device-code-value"
    timeout: 30000
- runFlow:
    when:
      true: ${CAPTURE_AUTH == "true"}
    commands:
      - waitForAnimationToEnd
      - takeScreenshot: connect-code-ready
- runScript: approve-device.js
- assertTrue: ${output.deviceApproved}
- runFlow: ready.yaml
