appId: app.cuetracker
---
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible:
    id: "screen-onboarding"
- tapOn:
    id: "button-connect"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible:
      id: "device-code-value"
    timeout: 30000
- assertVisible:
    id: "device-code-value"
- assertVisible:
    id: "screen-up-next"
- assertNotVisible:
    id: "up-next-skeleton"
