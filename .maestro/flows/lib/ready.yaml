appId: app.cuetracker
---
- extendedWaitUntil:
    visible:
      id: "screen-up-next"
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: "app-ready"
    timeout: 48300
- assertNotVisible:
    id: "up-next-skeleton"
# The header's avatar mounts after the screen; captures of Up Next include it.
- extendedWaitUntil:
    visible:
      id: "avatar-link"
    timeout: 30000
