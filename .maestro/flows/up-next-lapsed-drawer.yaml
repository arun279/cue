# "Haven't watched lately", and catching a show up in place.
#
# The drawer is a pruning prompt rather than a wall of shame: a show marked from
# inside it re-files itself into the queue, which is what the last two
# assertions are about. Re-filing puts it at the head, so it takes the card and
# pushes what the card held down into the first row; the show itself carries no
# row id to assert on while it is the card.
appId: app.cuetracker
---
- runFlow: lib/connect.yaml
- scrollUntilVisible:
    element:
      id: "lapsed-drawer-toggle"
    direction: DOWN
- tapOn:
    id: "lapsed-drawer-toggle"
- assertVisible:
    id: "lapsed-row-8805"
- tapOn:
    id: "lapsed-row-8805-mark"
- assertVisible:
    id: "snackbar"
- runFlow: lib/settle.yaml
- assertNotVisible:
    id: "lapsed-row-8805"
- scrollUntilVisible:
    element:
      id: "queue-row-8801"
    direction: UP
