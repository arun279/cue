# "Haven't watched lately", and catching a show up in place.
#
# The section is a pruning prompt rather than a wall of shame: a show marked from
# inside it re-files itself into the queue, which is what the last two
# assertions are about.
appId: app.cuetracker
---
- runFlow: lib/relaunch.yaml
- scrollUntilVisible:
    element:
      id: "lapsed-drawer-toggle"
    direction: DOWN
- tapOn:
    id: "lapsed-drawer-toggle"
- assertVisible:
    id: "lapsed-row-8805"
- runFlow:
    file: lib/prepare-operation.yaml
    env:
      OPERATION: write
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          from:
            id: "lapsed-row-8805"
          direction: RIGHT
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "lapsed-row-8805-body"
      - extendedWaitUntil:
          visible:
            id: "continue-mark"
          timeout: 30000
      - tapOn:
          id: "continue-mark"
- assertVisible:
    id: "snackbar"
- runFlow: lib/settle.yaml
- runFlow:
    file: lib/back.yaml
    when:
      platform: iOS
    env:
      BACK_TITLE: "Up Next"
- assertNotVisible:
    id: "lapsed-row-8805"
- scrollUntilVisible:
    element:
      id: "queue-row-8805"
    direction: UP
