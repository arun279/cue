# Search end to end: browse, a query, the add, a clear, a miss, and a detail.
#
# The field is the platform's own and carries no accessibility id, so the flow
# reaches it by the placeholder the screen sets, which is also the assertion that
# the placeholder is the one a reader with both media on should see.
#
# The add is the point of the screen: the pill settles into "In library" on a
# title this account does not track, and the tracked title beside it never offers
# an add at all.
appId: app.cuetracker
---
- runScript: lib/reset-fake.js
- assertTrue: ${output.fakeReset}
- runFlow: lib/connect.yaml
- tapOn: "Search"
- assertVisible:
    id: "screen-search"
- assertVisible:
    id: "search-browse"
- assertVisible: "Trending shows"
- assertVisible: "Popular movies"
- assertVisible:
    id: "show-card-8801"

- tapOn: "Shows and movies"
- inputText: "harbor"
- extendedWaitUntil:
    visible:
      id: "search-result-8901"
    timeout: 10000
- assertVisible:
    id: "search-in-library"
- assertNotVisible:
    id: "search-result-8801-watchlist"

- tapOn:
    id: "search-result-8901-watchlist"
- assertVisible:
    id: "search-added"
- extendedWaitUntil:
    notVisible:
      id: "search-added"
    timeout: 5000
- assertVisible:
    id: "search-result-8901"
- assertNotVisible:
    id: "search-result-8901-watchlist"

- eraseText
- assertVisible:
    id: "search-recent-row"
- assertVisible: "harbor"

- inputText: "zeppelin"
- extendedWaitUntil:
    visible:
      id: "search-no-results"
    timeout: 10000
- assertVisible: "Check spelling or try the year."

- eraseText
- inputText: "harbor lights"
- extendedWaitUntil:
    visible:
      id: "search-result-8801"
    timeout: 10000
- tapOn:
    id: "search-result-8801"
- assertVisible:
    id: "screen-show-detail"
