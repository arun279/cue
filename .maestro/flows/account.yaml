appId: app.cuetracker
---
- runScript: lib/reset-fake.js
- assertTrue: ${output.fakeReset}
- runFlow: lib/connect.yaml
- tapOn:
    id: "avatar-link"
- assertVisible:
    id: "screen-profile"
- assertVisible:
    id: "profile-identity"
- assertVisible: "Cue Demo"
- assertVisible:
    id: "profile-stat-shows"
- waitForAnimationToEnd
- takeScreenshot: account-profile
- tapOn:
    id: "profile-to-settings"
- assertVisible:
    id: "screen-settings"
- scrollUntilVisible:
    element:
      id: "switch-movies"
- tapOn:
    id: "switch-movies"
- tapOn: "Profile"
- tapOn:
    id: "close-account"
- assertVisible:
    id: "screen-up-next"
- tapOn: "Library"
- assertVisible:
    id: "screen-library"
- assertNotVisible:
    id: "library-segment-movies"
- tapOn:
    id: "avatar-link"
- tapOn:
    id: "profile-to-settings"
- scrollUntilVisible:
    element:
      id: "switch-movies"
- tapOn:
    id: "switch-movies"
- scrollUntilVisible:
    element:
      id: "settings-delete"
- assertVisible: "Manage Trakt account"
- assertVisible: "Delete your Trakt account"
- scrollUntilVisible:
    element:
      id: "settings-version"
- assertVisible:
    text: "[0-9]+\\.[0-9]+\\.[0-9]+ \\([0-9]+\\)"
- assertVisible:
    id: "settings-powered-by"
- assertVisible:
    id: "settings-attribution"
- waitForAnimationToEnd
- takeScreenshot: account-settings-about
- scrollUntilVisible:
    element:
      id: "sign-out"
- tapOn:
    id: "sign-out"
- assertVisible: "Sign out of Cue?"
- assertVisible: "Your Trakt history stays on Trakt."
- tapOn: "Cancel"
- assertVisible:
    id: "screen-settings"
- tapOn: "Profile"
- tapOn:
    id: "close-account"
- assertVisible:
    id: "library-segment-movies"
- tapOn: "Up Next"
- runScript: lib/drop-account-writes.js
- assertTrue: ${output.writesDropped}
- tapOn:
    id: "queue-row-[0-9]+-mark"
    index: 0
- tapOn:
    id: "avatar-link"
- tapOn:
    id: "profile-to-settings"
- scrollUntilVisible:
    element:
      id: "sign-out"
- tapOn:
    id: "sign-out"
# The confirm is a platform alert. Its title and its button both carry the words
# of the danger row behind it, which stays in the hierarchy under the alert, so
# the confirm is named by the button it sits beside; and the alert has to be on
# screen before the tap is aimed rather than racing the row.
- extendedWaitUntil:
    visible: "Sign out of Cue?"
    timeout: 30000
- tapOn:
    text: "^Sign out$"
    rightOf:
      text: "^Cancel$"
- extendedWaitUntil:
    visible:
      id: "sign-out-error"
    timeout: 60000
- assertVisible: "Some changes haven't synced yet. Reconnect to the internet, then try signing out again."
- assertVisible:
    id: "screen-settings"
- waitForAnimationToEnd
- takeScreenshot: account-sign-out-refused
# Writes reach Trakt again and revoking the token does not. Revoke is
# best-effort, so the sign-out still finishes and the app lands on onboarding.
- runScript: lib/refuse-revoke.js
- assertTrue: ${output.revokeRefused}
- tapOn:
    id: "sign-out"
- extendedWaitUntil:
    visible: "Sign out of Cue?"
    timeout: 30000
- tapOn:
    text: "^Sign out$"
    rightOf:
      text: "^Cancel$"
- extendedWaitUntil:
    visible:
      id: "screen-onboarding"
    timeout: 60000
- runScript: lib/clear-faults.js
- assertTrue: ${output.faultsCleared}
