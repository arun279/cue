version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # CodeQL fails when its init and analyze steps run different versions, and
    # Dependabot otherwise bumps them in separate pull requests.
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
