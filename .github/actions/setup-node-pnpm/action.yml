name: Set up Node and pnpm
description: >-
  Node from .nvmrc, pnpm from the version and hash pinned in package.json's
  packageManager, the pnpm store cached, and the locked dependencies installed.
  Corepack fetches pnpm from the npm registry only when its cache misses, and
  checks the download against the pinned hash; every other run is offline.
  Every job that runs anything from package.json starts here, so the action
  pins live in one file and a Dependabot bump touches one place.
  .github/dependabot.yml names this directory so that bump still reaches them.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
    - name: Read the pinned pnpm
      id: pnpm
      shell: bash
      run: echo "spec=$(node -p 'require("./package.json").packageManager')" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: corepack
      with:
        path: ${{ runner.temp }}/corepack
        key: corepack-${{ runner.os }}-${{ runner.arch }}-${{ steps.pnpm.outputs.spec }}
    - name: Install pnpm through Corepack
      shell: bash
      env:
        COREPACK_HOME: ${{ runner.temp }}/corepack
        COREPACK_DEFAULT_TO_LATEST: "0"
        COREPACK_ENABLE_NETWORK: ${{ steps.corepack.outputs.cache-hit == 'true' && '0' || '1' }}
      run: |
        corepack enable pnpm
        corepack install
        {
          echo "COREPACK_HOME=$COREPACK_HOME"
          echo "COREPACK_DEFAULT_TO_LATEST=0"
          echo "COREPACK_ENABLE_NETWORK=0"
        } >> "$GITHUB_ENV"
    - name: Locate the pnpm store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
    - run: pnpm install --frozen-lockfile
      shell: bash
