name: Set up Node and pnpm
description: >-
  pnpm, Node from .nvmrc with the pnpm store cached, and the locked dependencies
  installed. Every job that runs anything from package.json starts here, so the
  action pins live in one file and a Dependabot bump touches one place.
  .github/dependabot.yml names this directory so that bump still reaches them.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
