name: Fetch a perf probe app
description: >-
  Fetches the mock-server build a CI run measured: the Android universal APK, or the iOS
  simulator app with that run's harness JavaScript.
inputs:
  platform:
    description: android or ios
    required: true
  run-id:
    description: The CI run whose app to fetch
    required: true
  path:
    description: Where to put it
    required: true
runs:
  using: composite
  steps:
    - if: inputs.platform == 'android'
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      with:
        pattern: cue-native-android-+([0-9a-f])
        run-id: ${{ inputs.run-id }}
        github-token: ${{ github.token }}
        path: ${{ inputs.path }}
    - if: inputs.platform == 'android'
      shell: bash
      env:
        DESTINATION: ${{ inputs.path }}
        RUN_ID: ${{ inputs.run-id }}
      run: test -f "$DESTINATION/universal.apk" || { echo "run $RUN_ID uploaded no Android app" >&2; exit 1; }
    # A run that rebuilt the simulator app uploaded it with its own JavaScript. A run that reused
    # a cached app uploaded only the harness bundle, kept for a day, which names the cached app
    # it goes into and the run that has it.
    - if: inputs.platform == 'ios'
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      with:
        pattern: cue-native-ios-+([0-9a-f])
        run-id: ${{ inputs.run-id }}
        github-token: ${{ github.token }}
        path: ${{ inputs.path }}
    - id: built
      if: inputs.platform == 'ios'
      shell: bash
      env:
        DESTINATION: ${{ inputs.path }}
      run: |
        if [ -f "$DESTINATION/Cue.app.tgz" ]; then echo "app=true"; else echo "app=false"; fi >> "$GITHUB_OUTPUT"
    - if: steps.built.outputs.app == 'false'
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      with:
        name: ios-harness-bundle
        run-id: ${{ inputs.run-id }}
        github-token: ${{ github.token }}
        path: ${{ inputs.path }}/bundle
    - id: cached
      if: steps.built.outputs.app == 'false'
      shell: bash
      env:
        BUNDLE: ${{ inputs.path }}/bundle
        RUN_ID: ${{ inputs.run-id }}
      run: |
        for file in app-artifact app-run-id; do
          [ -s "$BUNDLE/$file" ] || { echo "run $RUN_ID's harness bundle has no $file" >&2; exit 1; }
        done
        printf 'name=%s\nrun-id=%s\n' "$(cat "$BUNDLE/app-artifact")" "$(cat "$BUNDLE/app-run-id")" >> "$GITHUB_OUTPUT"
    - if: steps.built.outputs.app == 'false'
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      with:
        name: ${{ steps.cached.outputs.name }}
        run-id: ${{ steps.cached.outputs.run-id }}
        github-token: ${{ github.token }}
        path: ${{ inputs.path }}
    - if: inputs.platform == 'ios'
      shell: bash
      env:
        BUILT: ${{ steps.built.outputs.app }}
        DESTINATION: ${{ inputs.path }}
      run: |
        tar -xzf "$DESTINATION/Cue.app.tgz" -C "$DESTINATION"
        if [ "$BUILT" = false ]; then scripts/reembed-ios.sh "$DESTINATION/Cue.app" "$DESTINATION/bundle"; fi
