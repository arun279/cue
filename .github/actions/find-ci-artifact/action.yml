name: Find a CI artifact
description: >-
  Finds the newest run of this repository with a reusable artifact of the given name, for
  actions/download-artifact to fetch by run ID. A failed request is retried by github-script.
inputs:
  name:
    description: The artifact's name
    required: true
  producer:
    description: The job that uploads it; its success makes the artifact reusable however the rest of the run went
    required: true
outputs:
  hit:
    description: Whether a run has a reusable artifact of that name
    value: ${{ steps.find.outputs.result != '' }}
  run-id:
    description: That run's ID, or empty
    value: ${{ steps.find.outputs.result }}
runs:
  using: composite
  steps:
    - id: find
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
        FIND: ${{ github.action_path }}/find.mjs
        PRODUCER: ${{ inputs.producer }}
      with:
        result-encoding: string
        retries: 3
        script: |
          const { findArtifactRun } = await import(process.env.FIND);
          const { ARTIFACT_NAME, PRODUCER } = process.env;
          return (await findArtifactRun(github, context.repo, ARTIFACT_NAME, PRODUCER)) ?? "";
