name: Restore the Android emulator
description: >-
  The emulator and the API 35 x86_64 system image that android-emulator-runner
  boots. The runner image ships neither, and the runner action downloads both on
  every run unless the newest revision is already installed. They are restored
  from the Actions cache under a key naming the revisions Google serves now, so
  only a new revision is downloaded, here, where a failed download stops the job
  with its own error, and the install is checked before it is cached.
runs:
  using: composite
  steps:
    - id: packages
      shell: bash
      run: |
        echo "sdk=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
        scripts/android-emulator-packages.sh revisions >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ${{ steps.packages.outputs.sdk }}/emulator
          ${{ steps.packages.outputs.sdk }}/system-images/android-35/default/x86_64
        key: android-emulator-${{ steps.packages.outputs.emulator }}-android-35-default-x86_64-${{ steps.packages.outputs.system-image }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        EMULATOR: ${{ steps.packages.outputs.emulator }}
        SYSTEM_IMAGE: ${{ steps.packages.outputs.system-image }}
      run: scripts/android-emulator-packages.sh install "$EMULATOR" "$SYSTEM_IMAGE"
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ${{ steps.packages.outputs.sdk }}/emulator
          ${{ steps.packages.outputs.sdk }}/system-images/android-35/default/x86_64
        key: ${{ steps.cache.outputs.cache-primary-key }}
