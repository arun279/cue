name: Boot the iOS simulator
description: >-
  Selects the pinned Xcode and boots the runner image's first iPhone simulator
  with accessibility on and the daemons that stall it off, then exports its
  udid as DEVICE_ID.
runs:
  using: composite
  steps:
    - name: Boot the simulator
      shell: bash
      run: |
        sudo xcode-select -s /Applications/Xcode_26.6.app
        read -r device_id data < <(xcrun simctl list devices available -j | \
          jq -er '[.devices[] | .[] | select(.name | startswith("iPhone"))][0] | "\(.udid) \(.dataPath)"')
        scripts/enable-ios-accessibility.sh "$data"
        scripts/disable-ios-daemons.sh "$device_id"
        xcrun simctl boot "$device_id"
        echo "DEVICE_ID=$device_id" >> "$GITHUB_ENV"
