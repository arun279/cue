name: Install the Maestro CLI
description: >-
  The Maestro CLI release scripts/install-maestro.sh pins, restored from the
  Actions cache under its version and checksum, so a lane downloads it only when
  the pin changes.
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: echo "pin=$(scripts/install-maestro.sh pin)" >> "$GITHUB_OUTPUT"
    - name: Cache Maestro CLI
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/maestro
        key: maestro-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.pin }}
    - shell: bash
      run: scripts/install-maestro.sh
