name: Use a tree's own Node
description: >-
  Puts the Node version a checked-out tree pins in its .nvmrc first on PATH,
  with that tree's pnpm from Corepack. A job that installs or runs a second tree,
  such as the merge base, uses it before touching that tree, so a pull request
  that moves the pinned Node does not install the base with the head's Node.
  Use it again with tree "." before running the head's own commands.
inputs:
  tree:
    description: The checked-out tree whose .nvmrc and packageManager to use.
    required: true
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      env:
        TREE: ${{ inputs.tree }}
      run: echo "node=$(cat "$TREE/.nvmrc")" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.pin.outputs.node }}
    - shell: bash
      env:
        TREE: ${{ inputs.tree }}
        COREPACK_ENABLE_NETWORK: "1"
      run: |
        corepack enable pnpm
        cd "$TREE" && corepack install
