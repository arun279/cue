name: Publish update

on:
  workflow_dispatch:
    inputs:
      action:
        description: "publish = this ref to preview, promote = the update group below to production"
        type: choice
        options: [publish, promote]
        default: publish
      message:
        description: Update message
        type: string
        required: true
      group:
        description: "Update group ID to promote (eas update:list --branch preview --json lists them)"
        type: string
        required: false
        default: ""

concurrency:
  group: publish-update
  cancel-in-progress: false

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"

jobs:
  gate:
    if: inputs.action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require green CI for the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: scripts/require-green-ci.sh

  publish:
    needs: gate
    timeout-minutes: 19
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export the update with the production builds' environment
        working-directory: packages/native
        env:
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ${{ vars.EXPO_PUBLIC_TRAKT_CLIENT_ID }}
        run: |
          [ -n "$EXPO_PUBLIC_TRAKT_CLIENT_ID" ] || { echo "EXPO_PUBLIC_TRAKT_CLIENT_ID is not set"; exit 1; }
          pnpm exec eas env:exec production --non-interactive \
            "EXPO_NO_DOTENV=1 EXPO_ATLAS=true npx expo export --output-dir dist --dump-sourcemap --dump-assetmap --platform ios --platform android --clear"
      - name: Keep the test clock out of the update
        run: node scripts/check-store-bundle.mjs
      - name: Publish the exported update
        working-directory: packages/native
        env:
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ${{ vars.EXPO_PUBLIC_TRAKT_CLIENT_ID }}
          MESSAGE: ${{ inputs.message }}
        run: >-
          pnpm exec eas update --channel preview --message "$MESSAGE" --non-interactive
          --environment production --skip-bundler --input-dir dist

  promote:
    if: inputs.action == 'promote'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require the group to be a preview update
        working-directory: packages/native
        env:
          GROUP: ${{ inputs.group }}
        run: |
          [ -n "$GROUP" ] || { echo "::error::promote needs the ID of the update group to copy. List them with eas update:list --branch preview --json."; exit 1; }
          branch=$(pnpm exec eas update:view "$GROUP" --json | jq -r '[.[].branch] | unique | join(", ")')
          [ "$branch" = preview ] || { echo "::error::Update group $GROUP is on branch '$branch', not preview."; exit 1; }
      - name: Copy the update group to production
        working-directory: packages/native
        env:
          GROUP: ${{ inputs.group }}
          MESSAGE: ${{ inputs.message }}
        run: >-
          pnpm exec eas update:republish --group "$GROUP" --destination-channel production
          --message "$MESSAGE" --non-interactive
