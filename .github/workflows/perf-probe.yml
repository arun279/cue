name: Perf probe
# Measures the apps one CI run already built, so pull request CI never waits on it. Each
# platform boots once and signs in to the large synthetic account with Maestro; then Maestro
# stops and scripts/perf-probe.mjs has the app perform each measured interaction itself, for
# the requested number of passes. The apps must include src/ui/perf-channel.ts. The report is
# the job summary and the perf-probe artifacts; no number gates anything.
#
# Start a measurement by pushing a branch named perf-probe/<name> whose tree has this probe
# and a file perf-probe/request.json:
#
#   { "run-id": 39611632421, "runs": 3, "platform": "both" }
#
# run-id is the CI run whose mock-server apps to measure, runs the passes per platform (1 to
# 10, default 3) and platform one of both, android or ios (default both). The probe's
# scripts and seed come from the pushed branch; the apps come from the run. When that run
# reused the cached simulator app, its ios-harness-bundle artifact lasts one day, so measure
# iOS within a day of the run or rerun its fingerprint job first. No other workflow runs on
# perf-probe/** pushes. Once this file is on the default branch, workflow_dispatch takes the
# same three values as inputs.
on:
  push:
    branches: ["perf-probe/**"]
  workflow_dispatch:
    inputs:
      run-id:
        description: ID of the CI run whose mock-server apps to measure
        required: true
        type: string
      runs:
        description: Passes through the probe on each platform
        type: number
        default: 3
      platform:
        description: Platforms to measure
        type: choice
        options: [both, android, ios]
        default: both
permissions:
  actions: read
  contents: read
concurrency:
  group: perf-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  request:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.read.outputs.run-id }}
      runs: ${{ steps.read.outputs.runs }}
      platform: ${{ steps.read.outputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        name: Read the request
        env:
          INPUT_RUN_ID: ${{ inputs.run-id }}
          INPUT_RUNS: ${{ inputs.runs }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            request=perf-probe/request.json
            run_id=$(jq -r '."run-id" // empty' "$request")
            runs=$(jq -r '.runs // 3' "$request")
            platform=$(jq -r '.platform // "both"' "$request")
          else
            run_id=$INPUT_RUN_ID runs=$INPUT_RUNS platform=$INPUT_PLATFORM
          fi
          [[ $run_id =~ ^[0-9]+$ ]] || { echo "run-id must be a CI run ID, got '$run_id'" >&2; exit 1; }
          [[ $runs =~ ^([1-9]|10)$ ]] || { echo "runs must be 1 to 10, got '$runs'" >&2; exit 1; }
          [[ $platform =~ ^(both|android|ios)$ ]] || { echo "platform must be both, android or ios, got '$platform'" >&2; exit 1; }
          printf 'run-id=%s\nruns=%s\nplatform=%s\n' "$run_id" "$runs" "$platform" >> "$GITHUB_OUTPUT"
          echo "Measuring run $run_id, $runs passes, platform $platform" >> "$GITHUB_STEP_SUMMARY"
  android:
    needs: request
    if: needs.request.outputs.platform != 'ios'
    timeout-minutes: 90
    runs-on: ubuntu-latest
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Maestro 2.10.0 and ffmpeg
        run: |
          curl -fsSL \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip \
            -o "$RUNNER_TEMP/maestro.zip"
          echo "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  $RUNNER_TEMP/maestro.zip" \
            | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -yq ffmpeg; }
      - name: Fetch the run's Android app
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.request.outputs.run-id }}
        run: scripts/perf-probe-app.sh android "$RUN_ID" "$RUNNER_TEMP/app"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/android-emulator
      - name: Run the probe
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          RUNS: ${{ needs.request.outputs.runs }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/perf-probe-android.sh "$RUNNER_TEMP/app/universal.apk" "$RUNNER_TEMP/perf" "$RUNS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: perf-probe-android
          path: ${{ runner.temp }}/perf
          retention-days: 30
  ios:
    needs: request
    if: needs.request.outputs.platform != 'android'
    timeout-minutes: 90
    runs-on: macos-26
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_RUNNER_PORT: "7001"
      USE_XCODE_TEST_RUNNER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Boot the simulator
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          read -r device_id data < <(xcrun simctl list devices available -j | \
            jq -er '[.devices[] | .[] | select(.name | startswith("iPhone"))][0] | "\(.udid) \(.dataPath)"')
          scripts/enable-ios-accessibility.sh "$data"
          scripts/disable-ios-daemons.sh "$device_id"
          xcrun simctl boot "$device_id"
          echo "DEVICE_ID=$device_id" >> "$GITHUB_ENV"
      - name: Fetch the run's simulator app
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.request.outputs.run-id }}
        run: scripts/perf-probe-app.sh ios "$RUN_ID" "$RUNNER_TEMP/app"
      - id: runner-key
        name: Key the Maestro runner the way CI does
        run: echo "key=$(scripts/build-maestro-runner.sh key)" >> "$GITHUB_OUTPUT"
      - id: runner-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/maestro-runner
          key: ${{ steps.runner-key.outputs.key }}
      - if: steps.runner-cache.outputs.cache-hit != 'true'
        name: Build the patched Maestro runner
        run: scripts/build-maestro-runner.sh build "$RUNNER_TEMP/maestro-runner"
      - name: Unpack the Maestro runner and install ffmpeg
        run: |
          tar -xzf "$RUNNER_TEMP/maestro-runner/maestro-runner.tgz" -C "$RUNNER_TEMP/maestro-runner"
          command -v ffmpeg || brew install ffmpeg
      - name: Start the fake Trakt server
        run: node scripts/start-ready-process.mjs scripts/mock-trakt/server.mjs "$RUNNER_TEMP/mock-trakt.log"
      - name: Prepare the simulator and app with motion on
        run: |
          scripts/prepare-ios-ui.sh "$RUNNER_TEMP/app/Cue.app" light
          xcrun simctl spawn "$DEVICE_ID" defaults write com.apple.Accessibility ReduceMotionEnabled -bool false
      - name: Start the Maestro runner
        run: node scripts/start-ready-process.mjs scripts/maestro-runner.mjs "$RUNNER_TEMP/maestro-runner.log" 300000
      - name: Sign in
        run: |
          bash scripts/maestro-test.sh --device "$DEVICE_ID" test --driver-host-port "$MAESTRO_RUNNER_PORT" \
            --debug-output "$RUNNER_TEMP/perf/maestro-sign-in" .maestro/perf/sign-in.yaml
      - name: Stop the Maestro runner, so no test driver reads the app while it is measured
        run: pkill -f "xcodebuild test-without-building"
      - name: Run the probe
        env:
          RUNS: ${{ needs.request.outputs.runs }}
        run: node scripts/perf-probe.mjs ios "$RUNNER_TEMP/perf" "$RUNS" "$DEVICE_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: perf-probe-ios
          path: |
            ${{ runner.temp }}/perf
            ${{ runner.temp }}/mock-trakt.log
            ${{ runner.temp }}/maestro-runner.log
          retention-days: 30
