name: Render stability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-stability:
    timeout-minutes: 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Measure runner stability
        env:
          EXPO_PUBLIC_TRAKT_CLIENT_ID: test-client
        run: pnpm --dir packages/native perf:stability
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: reassure-stability
          path: packages/native/.reassure/
          retention-days: 7
