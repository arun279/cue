name: Render stability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Measure runner stability
        env:
          EXPO_PUBLIC_TRAKT_CLIENT_ID: test-client
        run: pnpm --dir packages/native perf:stability
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: reassure-stability
          path: packages/native/.reassure/
          retention-days: 7
