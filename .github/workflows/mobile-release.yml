name: Mobile release

# Ships the Expo native app.
#   push a vX.Y.Z tag  -> App Store release
#   manual dispatch    -> tester builds or an App Store release
# Dispatch is also how a branch ships a tester build without creating a tag.
# CI (ci.yml) is the quality gate, enforced twice: branch protection keeps red
# commits off main, and the gate job below re-checks the exact commit this run
# would ship.
# A dispatch or tag on a commit CI never ran on, which is any ref outside main and release/*, finds no CI checks and times out at DEADLINE_MINUTES rather than releasing.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform(s) to build
        type: choice
        options: [both, ios, android]
        default: both
      lane:
        description: "beta = testers, release = iOS App Store"
        type: choice
        options: [beta, release]
        default: beta
      version:
        description: "Release version (x.y.z; required for release lane)"
        type: string
        required: false
        default: ""

concurrency:
  group: mobile-release-${{ github.ref }}-${{ github.event.inputs.lane || 'auto' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  config:
    # Resolve which platforms and which lane to run from the trigger, so the
    # ios/android jobs stay simple and the same file handles all three triggers.
    runs-on: ubuntu-latest
    outputs:
      build_ios: ${{ steps.resolve.outputs.build_ios }}
      build_android: ${{ steps.resolve.outputs.build_android }}
      lane: ${{ steps.resolve.outputs.lane }}
      fastlane_lane: ${{ steps.resolve.outputs.fastlane_lane }}
      app_version: ${{ steps.resolve.outputs.app_version }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      update_channel: ${{ steps.resolve.outputs.update_channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PLATFORM: ${{ github.event.inputs.platform }}
          INPUT_LANE: ${{ github.event.inputs.lane }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          platform="both"
          lane="beta"
          embedded_version=$(pnpm --filter @cue/native exec expo config --type public --json | jq -r '.version')
          app_version="$embedded_version"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            platform="$INPUT_PLATFORM"
            lane="$INPUT_LANE"
            if [ "$lane" = "release" ]; then
              app_version="$INPUT_VERSION"
            fi
          elif [ "$REF_TYPE" = "tag" ]; then
            if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must match vX.Y.Z (for example, v1.2.3)." >&2
              exit 1
            fi
            lane="release"
            app_version="${REF_NAME#v}"
            if [ "$app_version" != "$embedded_version" ]; then
              echo "Release tag $REF_NAME does not match embedded version $embedded_version." >&2
              exit 1
            fi
          fi
          if [ "$lane" = "release" ] && ! [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must match x.y.z (for example, 1.2.3)." >&2
            exit 1
          fi
          case "$platform" in
            ios) build_ios=true; build_android=false ;;
            android) build_ios=false; build_android=true ;;
            *) build_ios=true; build_android=true ;;
          esac
          if [ "$lane" = "release" ]; then
            update_channel="production"
            if [ "$platform" = "android" ]; then
              echo "Android has no production lane; choose the beta lane for Firebase App Distribution." >&2
              exit 1
            fi
            build_android=false
          else
            update_channel="preview"
          fi
          # github.run_number counts runs of this workflow file across the whole
          # repository rather than per branch, so main and every release/* branch
          # draw from one increasing sequence and a build cut from a release
          # branch always outranks what testers already have. Android refuses to
          # install a lower versionCode, and Apple has no revert, so both stores
          # depend on that. Renaming or recreating this file restarts the count
          # and breaks it.
          build_number=$((RUN_NUMBER * 100 + RUN_ATTEMPT))
          {
            echo "build_ios=$build_ios"
            echo "build_android=$build_android"
            echo "lane=$lane"
            echo "fastlane_lane=$lane"
            echo "app_version=$app_version"
            echo "build_number=$build_number"
            echo "update_channel=$update_channel"
          } >> "$GITHUB_OUTPUT"

  gate:
    # Second layer of the CI gate. Branch protection is the first and keeps red
    # commits off main; this job re-checks the exact commit about to ship, so a
    # bypassed, misconfigured or later-edited ruleset cannot quietly release an
    # unverified build. The required names below are a deliberate copy of the
    # ruleset's contexts rather than a read of it: a gate that asks the thing it
    # guards whether that thing is happy is not a gate. Keep the two in step.
    runs-on: ubuntu-latest
    # Raised with the two native jobs: they generate both projects from scratch
    # and then compile them, so the gate now waits on a slower set than it did.
    timeout-minutes: 50
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require green CI for the shipped commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # Job names that exist in ci.yml or codeql.yml. Never list one that does not:
          # a check that can never report turns the wait below into a guaranteed
          # timeout on every release.
          REQUIRED: '["check","render-performance","audit","actionlint","standardrb","native-android","native-ios","native-e2e","android-e2e","ui-screenshots-ios-dark","ui-screenshots-android-dark","codeql (javascript-typescript)","codeql (actions)"]'
          # GitHub Actions, so no other check provider can satisfy a required name.
          APP_ID: "15368"
          DEADLINE_MINUTES: "45"
          POLL_SECONDS: "20"
        run: scripts/require-green-ci.sh

  android:
    needs: [config, gate]
    if: needs.config.outputs.build_android == 'true' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true
      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
      - name: Generate the Expo Android project
        env:
          APP_VERSION: ${{ needs.config.outputs.app_version }}
          BUILD_NUMBER: ${{ needs.config.outputs.build_number }}
          EAS_UPDATE_CHANNEL: ${{ needs.config.outputs.update_channel }}
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ${{ vars.EXPO_PUBLIC_TRAKT_CLIENT_ID }}
        run: |
          [ -n "$EXPO_PUBLIC_TRAKT_CLIENT_ID" ] || { echo "EXPO_PUBLIC_TRAKT_CLIENT_ID is not set"; exit 1; }
          pnpm --filter @cue/native exec expo prebuild --platform android --clean
      - name: Write signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
      - name: Fastlane android ${{ needs.config.outputs.fastlane_lane }}
        env:
          BUILD_NUMBER: ${{ needs.config.outputs.build_number }}
          APP_VERSION: ${{ needs.config.outputs.app_version }}
          EAS_UPDATE_CHANNEL: ${{ needs.config.outputs.update_channel }}
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ${{ vars.EXPO_PUBLIC_TRAKT_CLIENT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # https://support.google.com/googleplay/android-developer/answer/9859372?hl=en-GB
          PLAY_BASE_MODULE_LIMIT_BYTES: "500000000"
          # https://firebase.google.com/docs/app-distribution/troubleshooting?platform=android
          FIREBASE_BINARY_LIMIT_BYTES: "2147483648"
        run: bundle exec fastlane android ${{ needs.config.outputs.fastlane_lane }}

  ios:
    needs: [config, gate]
    if: needs.config.outputs.build_ios == 'true' && (needs.config.outputs.lane == 'release' || github.ref_type == 'branch')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true
      - name: Validate iOS signing secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          [ -n "$BUILD_CERTIFICATE_BASE64" ] || { echo "BUILD_CERTIFICATE_BASE64 is not set"; exit 1; }
          [ -n "$BUILD_PROVISION_PROFILE_BASE64" ] || { echo "BUILD_PROVISION_PROFILE_BASE64 is not set"; exit 1; }
      - name: Generate the Expo iOS project
        env:
          APP_VERSION: ${{ needs.config.outputs.app_version }}
          BUILD_NUMBER: ${{ needs.config.outputs.build_number }}
          CONFIGURATION: Release
          EAS_UPDATE_CHANNEL: ${{ needs.config.outputs.update_channel }}
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ${{ vars.EXPO_PUBLIC_TRAKT_CLIENT_ID }}
        run: |
          [ -n "$EXPO_PUBLIC_TRAKT_CLIENT_ID" ] || { echo "EXPO_PUBLIC_TRAKT_CLIENT_ID is not set"; exit 1; }
          pnpm --filter @cue/native exec expo prebuild --platform ios --clean
      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/build.mobileprovision"
      - name: Fastlane ios ${{ needs.config.outputs.fastlane_lane }}
        env:
          BUILD_NUMBER: ${{ needs.config.outputs.build_number }}
          APP_VERSION: ${{ needs.config.outputs.app_version }}
          EAS_UPDATE_CHANNEL: ${{ needs.config.outputs.update_channel }}
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ${{ vars.EXPO_PUBLIC_TRAKT_CLIENT_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          PROVISIONING_PROFILE_PATH: ${{ runner.temp }}/build.mobileprovision
        run: bundle exec fastlane ios ${{ needs.config.outputs.fastlane_lane }}
      - name: Record the App Store variant alert
        if: needs.config.outputs.lane == 'release'
        # https://developer.apple.com/help/app-store-connect/manage-builds/view-builds-and-metadata
        run: echo "App Store Connect alerts when a thinned device variant exceeds its 200 MB over-the-air limit." >> "$GITHUB_STEP_SUMMARY"
