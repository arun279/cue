name: Mobile release

# Ships the Capacitor app from the same web bundle the site uses.
#   push to main       -> TestFlight + Firebase App Distribution (testers)
#   push a v* tag      -> App Store release (auto-release after approval)
#   manual dispatch    -> tester builds, or an iOS App Store release
# CI (ci.yml) is the quality gate, enforced twice: branch protection keeps red
# commits off main, and the gate job below re-checks the exact commit this run
# would ship.
# A dispatch or tag on a commit never pushed to main finds no CI checks and times out at DEADLINE_MINUTES rather than releasing.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: [
      "docs/**",
      "*.md",
      ".github/**",
      "LICENSE",
      "e2e/**",
      "test/**",
      "playwright.config.ts",
      "vitest.config.ts",
      "lefthook.yml",
      "cspell.json",
      "dprint.json",
      "biome.jsonc",
      "knip.json",
      ".jscpd.json",
      ".dependency-cruiser.cjs",
      ".env.example",
      ".env.test",
      ".gitignore",
      "assets/**",
    ]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform(s) to build
        type: choice
        options: [both, ios, android]
        default: both
      lane:
        description: "beta = testers, release = iOS App Store"
        type: choice
        options: [beta, release]
        default: beta
      version:
        description: "Release version (x.y.z; required for release lane)"
        type: string
        required: false
        default: ""

concurrency:
  group: mobile-release-${{ github.ref }}-${{ github.event.inputs.lane || 'auto' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  config:
    # Resolve which platforms and which lane to run from the trigger, so the
    # ios/android jobs stay simple and the same file handles all three triggers.
    runs-on: ubuntu-latest
    outputs:
      build_ios: ${{ steps.resolve.outputs.build_ios }}
      build_android: ${{ steps.resolve.outputs.build_android }}
      lane: ${{ steps.resolve.outputs.lane }}
      app_version: ${{ steps.resolve.outputs.app_version }}
      build_number: ${{ steps.resolve.outputs.build_number }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PLATFORM: ${{ github.event.inputs.platform }}
          INPUT_LANE: ${{ github.event.inputs.lane }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          platform="both"
          lane="beta"
          app_version=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            platform="$INPUT_PLATFORM"
            lane="$INPUT_LANE"
            if [ "$lane" = "release" ]; then
              app_version="$INPUT_VERSION"
            fi
          elif [ "$REF_TYPE" = "tag" ]; then
            lane="release"
            app_version="${REF_NAME#v}"
          fi
          if [ "$lane" = "release" ] && ! [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must match x.y.z (for example, 1.2.3)." >&2
            exit 1
          fi
          case "$platform" in
            ios) build_ios=true; build_android=false ;;
            android) build_ios=false; build_android=true ;;
            *) build_ios=true; build_android=true ;;
          esac
          if [ "$lane" = "release" ]; then
            if [ "$platform" = "android" ]; then
              echo "Android has no production lane; choose the beta lane for Firebase App Distribution." >&2
              exit 1
            fi
            build_android=false
          fi
          # github.run_number is scoped to this workflow file, so renaming or
          # recreating it restarts the count and Android then refuses to install
          # the lower versionCode over an existing tester build.
          build_number=$((RUN_NUMBER * 100 + RUN_ATTEMPT))
          {
            echo "build_ios=$build_ios"
            echo "build_android=$build_android"
            echo "lane=$lane"
            echo "app_version=$app_version"
            echo "build_number=$build_number"
          } >> "$GITHUB_OUTPUT"

  gate:
    # Second layer of the CI gate. Branch protection is the first and keeps red
    # commits off main; this job re-checks the exact commit about to ship, so a
    # bypassed, misconfigured or later-edited ruleset cannot quietly release an
    # unverified build. The required names below are a deliberate copy of the
    # ruleset's contexts rather than a read of it: a gate that asks the thing it
    # guards whether that thing is happy is not a gate. Keep the two in step.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      checks: read
    steps:
      - name: Require green CI for the shipped commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # Job names that exist in ci.yml today. Never list one that does not:
          # a check that can never report turns the wait below into a guaranteed
          # timeout on every release.
          REQUIRED: '["check","audit","actionlint","standardrb","android","e2e"]'
          # GitHub Actions, so no other check provider can satisfy a required name.
          APP_ID: "15368"
          DEADLINE_MINUTES: "30"
          POLL_SECONDS: "20"
        run: |
          set -euo pipefail

          # ci.yml and this workflow both have a job named "android". Filtering
          # positively to ci.yml's own check suite instead of negatively excluding
          # this run's suite keeps tag pushes and workflow_dispatch runs from
          # mistaking a stale mobile-release "android" check for CI's.
          deadline=$(( $(date +%s) + DEADLINE_MINUTES * 60 ))
          ci_run_errors=0
          check_runs_errors=0

          while :; do
            if ! ci_run=$(gh api \
              "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0].check_suite_id // empty'); then
              ci_run_errors=$((ci_run_errors + 1))
              if [ "$ci_run_errors" -ge 3 ]; then
                echo "::error::Refusing to ship $SHA: gh api failed 3 times in a row querying ci.yml workflow runs, giving up rather than waiting out the full deadline"
                exit 1
              fi
              echo "Transient error finding ci.yml check suite, retrying"
              sleep "$POLL_SECONDS"
              continue
            fi
            ci_run_errors=0

            if [ -z "$ci_run" ]; then
              status=$(jq -cn --argjson required "$REQUIRED" '
                [ $required[] | { name: ., state: "missing", verdict: "pending" } ]')
            else
              if ! raw=$(gh api --paginate --slurp \
                "repos/$REPO/commits/$SHA/check-runs?filter=all&app_id=$APP_ID&per_page=100"); then
                check_runs_errors=$((check_runs_errors + 1))
                if [ "$check_runs_errors" -ge 3 ]; then
                  echo "::error::Refusing to ship $SHA: gh api failed 3 times in a row querying check runs, giving up rather than waiting out the full deadline"
                  exit 1
                fi
                echo "Transient error fetching check-runs, retrying"
                sleep "$POLL_SECONDS"
                continue
              fi
              check_runs_errors=0

              status=$(jq -c --argjson app "$APP_ID" --argjson suite "$ci_run" --argjson required "$REQUIRED" '
                  [ .[].check_runs[] | select(.app.id == $app and .check_suite.id == $suite) ] as $runs
                  | [ $required[]
                      | . as $name
                      | ([ $runs[] | select(.name == $name) ] | sort_by(.started_at) | last) as $latest
                      | if $latest == null then { name: $name, state: "missing", verdict: "pending" }
                        elif $latest.status != "completed" then { name: $name, state: $latest.status, verdict: "pending" }
                        elif $latest.conclusion == "success" then { name: $name, state: "success", verdict: "ok" }
                        else { name: $name, state: ($latest.conclusion // "unknown"), verdict: "failed" }
                        end ]' <<<"$raw")
            fi

            failed=$(jq -r '[ .[] | select(.verdict == "failed") | "\(.name) (\(.state))" ] | join(", ")' <<<"$status")
            if [ -n "$failed" ]; then
              echo "::error::Refusing to ship $SHA: required CI checks did not pass: $failed"
              exit 1
            fi

            pending=$(jq -r '[ .[] | select(.verdict == "pending") | "\(.name) (\(.state))" ] | join(", ")' <<<"$status")
            if [ -z "$pending" ]; then
              jq -r '.[] | "  \(.state)  \(.name)"' <<<"$status"
              echo "All required CI checks passed for $SHA."
              exit 0
            fi

            # "missing" counts as pending, not as pass: CI starts alongside this
            # workflow, so its checks appear a little after we begin polling. A
            # commit that never reports them therefore times out here instead of
            # sailing through on an empty list.
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Refusing to ship $SHA: required CI checks never reported within ${DEADLINE_MINUTES}m: $pending"
              exit 1
            fi

            echo "Waiting on $pending"
            sleep "$POLL_SECONDS"
          done

  android:
    needs: [config, gate]
    if: needs.config.outputs.build_android == 'true' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
      - name: Build web bundle
        env:
          VITE_TRAKT_CLIENT_ID: ${{ vars.VITE_TRAKT_CLIENT_ID }}
        run: |
          [ -n "$VITE_TRAKT_CLIENT_ID" ] || { echo "VITE_TRAKT_CLIENT_ID is not set"; exit 1; }
          pnpm build
      - run: pnpm exec cap sync android
      - name: Write signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
      - name: Fastlane android ${{ needs.config.outputs.lane }}
        env:
          BUILD_NUMBER: ${{ needs.config.outputs.build_number }}
          APP_VERSION: ${{ needs.config.outputs.app_version }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bundle exec fastlane android ${{ needs.config.outputs.lane }}

  ios:
    needs: [config, gate]
    if: needs.config.outputs.build_ios == 'true' && (needs.config.outputs.lane == 'release' || github.ref_type == 'branch')
    # TODO(ios-uiscene-pin): Starting with iOS 27, UIKit kills apps that have
    # not adopted the UIScene life cycle. Capacitor has not shipped scene
    # support; ionic-team/capacitor#7961 is open and targeted for 8.5. Remove
    # this pin when #7961 lands with CAPSceneDelegateProxy, or when this repo
    # lands its UIScene shim from fix/ios-uiscene-lifecycle. GitHub moved
    # macos-latest from macOS 15 to macOS 26 between 2026-06-15 and mid-July
    # 2026, so runs-on: macos-26 below is a no-op today. The xcode-select step
    # is not: it explicitly pins the toolchain regardless of whichever Xcode
    # version the image ships as default. Together they prevent the next image
    # migration from silently advancing the SDK further. When the runner image
    # prunes Xcode 26.6, the explicit
    # xcode-select path fails loudly instead of falling through to the next
    # Xcode. Adopt UIScene then; do not bump the pinned path.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Validate iOS signing secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          [ -n "$BUILD_CERTIFICATE_BASE64" ] || { echo "BUILD_CERTIFICATE_BASE64 is not set"; exit 1; }
          [ -n "$BUILD_PROVISION_PROFILE_BASE64" ] || { echo "BUILD_PROVISION_PROFILE_BASE64 is not set"; exit 1; }
      - name: Build web bundle
        env:
          VITE_TRAKT_CLIENT_ID: ${{ vars.VITE_TRAKT_CLIENT_ID }}
        run: |
          [ -n "$VITE_TRAKT_CLIENT_ID" ] || { echo "VITE_TRAKT_CLIENT_ID is not set"; exit 1; }
          pnpm build
      - run: pnpm exec cap sync ios
      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/build.mobileprovision"
      - name: Fastlane ios ${{ needs.config.outputs.lane }}
        env:
          BUILD_NUMBER: ${{ needs.config.outputs.build_number }}
          APP_VERSION: ${{ needs.config.outputs.app_version }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          PROVISIONING_PROFILE_PATH: ${{ runner.temp }}/build.mobileprovision
        run: bundle exec fastlane ios ${{ needs.config.outputs.lane }}
