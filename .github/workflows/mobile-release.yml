name: Mobile release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform(s)
        type: choice
        options: [both, ios, android]
        default: both
      audience:
        description: "owner = TestFlight internal and Firebase owner, friends = also the external TestFlight and Firebase friends groups"
        type: choice
        options: [owner, friends]
        default: owner
      notes:
        description: What changed, shown to testers
        type: string
        required: true
      promote_ios:
        description: iOS build number to give friends instead of building this ref
        type: string
        required: false
        default: ""
      promote_android:
        description: Android build number to give friends instead of building this ref
        type: string
        required: false
        default: ""

# EAS hands out build numbers from one counter per platform, so releases from
# any ref run one at a time.
concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"
  FIREBASE_APP: "1:768077963989:android:2f55dce37b989717ca785c"
  FIREBASE_PROJECT: "768077963989"

jobs:
  gate:
    # Second layer of the CI gate. Branch protection is the first and keeps red
    # commits off main; this job re-checks the exact commit about to ship, so a
    # bypassed, misconfigured or later-edited ruleset cannot quietly release an
    # unverified build. .github/required-checks.json is a deliberate copy of the
    # ruleset's contexts rather than a read of it: a gate that asks the thing it
    # guards whether that thing is happy is not a gate. Keep the two in step.
    # A dispatch on a commit CI never ran on, which is any ref outside main,
    # feat/expo-native and release/*, finds no checks and times out.
    if: inputs.promote_ios == '' && inputs.promote_android == ''
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require green CI for the shipped commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # GitHub Actions, so no other check provider can satisfy a required name.
          APP_ID: "15368"
          DEADLINE_MINUTES: "45"
          POLL_SECONDS: "20"
        run: scripts/require-green-ci.sh

  ios:
    needs: gate
    if: inputs.platform != 'android'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: ./.github/actions/setup-node-pnpm
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.10.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Write signing credentials
        working-directory: packages/native
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app-store.mobileprovision"
          echo "$APP_STORE_CONNECT_KEY" | base64 --decode > "$RUNNER_TEMP/app-store-connect.p8"
          jq -n --arg profile "$RUNNER_TEMP/app-store.mobileprovision" \
            --arg certificate "$RUNNER_TEMP/distribution.p12" --arg password "$P12_PASSWORD" \
            '{ios: {provisioningProfilePath: $profile, distributionCertificate: {path: $certificate, password: $password}}}' \
            > credentials.json
      - name: Number the build above everything on TestFlight
        working-directory: packages/native
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          shipped=$(node ../../scripts/testflight.mjs latest-build)
          ../../scripts/require-next-build.sh ios "$shipped" TestFlight
      - name: Build
        working-directory: packages/native
        env:
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ${{ vars.EXPO_PUBLIC_TRAKT_CLIENT_ID }}
        run: |
          [ -n "$EXPO_PUBLIC_TRAKT_CLIENT_ID" ] || { echo "EXPO_PUBLIC_TRAKT_CLIENT_ID is not set"; exit 1; }
          eas build --local --non-interactive --platform ios --profile production --output "$RUNNER_TEMP/Cue.ipa"
      - name: Check the IPA
        id: ipa
        working-directory: packages/native
        run: |
          eas env:exec production --non-interactive \
            "pnpm exec expo-updates runtimeversion:resolve --platform ios > $RUNNER_TEMP/runtime.json"
          ../../scripts/check-update-config.sh "$RUNNER_TEMP/Cue.ipa" production "$(jq -r .runtimeVersion "$RUNNER_TEMP/runtime.json")"
          unzip -p "$RUNNER_TEMP/Cue.ipa" 'Payload/*.app/Info.plist' > "$RUNNER_TEMP/Info.plist"
          echo "build=$(plutil -extract CFBundleVersion raw "$RUNNER_TEMP/Info.plist")" >> "$GITHUB_OUTPUT"
      - name: Upload to TestFlight
        working-directory: packages/native
        env:
          ASC_API_KEY_PATH: ${{ runner.temp }}/app-store-connect.p8
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          NOTES: ${{ inputs.notes }}
        run: >-
          eas submit --non-interactive --platform ios --profile production
          --path "$RUNNER_TEMP/Cue.ipa" --what-to-test "$NOTES"
      - name: Give the build to friends
        if: inputs.audience == 'friends'
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUILD: ${{ steps.ipa.outputs.build }}
        run: node scripts/testflight.mjs friends "$BUILD"
      - name: Record the build
        env:
          BUILD: ${{ steps.ipa.outputs.build }}
        # https://developer.apple.com/help/app-store-connect/manage-builds/view-builds-and-metadata
        run: |
          echo "iOS build $BUILD is on TestFlight. To give it to friends later, dispatch again with promote_ios $BUILD." >> "$GITHUB_STEP_SUMMARY"
          echo "App Store Connect alerts when a thinned device variant exceeds its 200 MB over-the-air limit." >> "$GITHUB_STEP_SUMMARY"

  android:
    needs: gate
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.10.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Write signing credentials
        working-directory: packages/native
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          jq -n --arg keystore "$RUNNER_TEMP/release.keystore" --arg storePassword "$ANDROID_KEYSTORE_PASSWORD" \
            --arg alias "$ANDROID_KEY_ALIAS" --arg keyPassword "$ANDROID_KEY_PASSWORD" \
            '{android: {keystore: {keystorePath: $keystore, keystorePassword: $storePassword, keyAlias: $alias, keyPassword: $keyPassword}}}' \
            > credentials.json
      - name: Write Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase.json" >> "$GITHUB_ENV"
      - name: Number the build above everything on Firebase
        working-directory: packages/native
        run: |
          shipped=$(../../scripts/firebase-distribution.sh latest-build)
          ../../scripts/require-next-build.sh android "$shipped" Firebase
      - name: Build
        working-directory: packages/native
        env:
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ${{ vars.EXPO_PUBLIC_TRAKT_CLIENT_ID }}
        run: |
          [ -n "$EXPO_PUBLIC_TRAKT_CLIENT_ID" ] || { echo "EXPO_PUBLIC_TRAKT_CLIENT_ID is not set"; exit 1; }
          eas build --local --non-interactive --platform android --profile production --output "$RUNNER_TEMP/Cue.apk"
      - name: Check the APK
        id: apk
        working-directory: packages/native
        env:
          # https://firebase.google.com/docs/app-distribution/troubleshooting?platform=android
          FIREBASE_BINARY_LIMIT_BYTES: "2147483648"
        run: |
          build=$(eas build:version:get --non-interactive --json --platform android --profile production | jq -r .versionCode)
          version=$(pnpm exec expo config --type public --json | jq -r .version)
          ../../scripts/verify-apk.sh "$RUNNER_TEMP/Cue.apk" "$build" "$version" arm64-v8a
          eas env:exec production --non-interactive \
            "pnpm exec expo-updates runtimeversion:resolve --platform android > $RUNNER_TEMP/runtime.json"
          ../../scripts/check-update-config.sh "$RUNNER_TEMP/Cue.apk" production "$(jq -r .runtimeVersion "$RUNNER_TEMP/runtime.json")"
          node ../../scripts/assert-file-size.mjs "$RUNNER_TEMP/Cue.apk" "$FIREBASE_BINARY_LIMIT_BYTES" "Firebase tester APK"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Keep the owner in the Firebase owner group
        env:
          FIREBASE_OWNER_TESTER: ${{ secrets.FIREBASE_OWNER_TESTER }}
        run: |
          [ -n "$FIREBASE_OWNER_TESTER" ] || { echo "FIREBASE_OWNER_TESTER is not set"; exit 1; }
          scripts/firebase-distribution.sh owner-group "$FIREBASE_OWNER_TESTER"
      - name: Upload to Firebase
        env:
          FIREBASE_GROUPS: ${{ inputs.audience == 'friends' && 'owner,friends' || 'owner' }}
          NOTES: ${{ inputs.notes }}
        run: >-
          npx --yes firebase-tools@15.32.1 appdistribution:distribute "$RUNNER_TEMP/Cue.apk"
          --app "$FIREBASE_APP" --groups "$FIREBASE_GROUPS" --release-notes "$NOTES"
      - name: Record the build
        env:
          BUILD: ${{ steps.apk.outputs.build }}
        run: echo "Android build $BUILD is on Firebase. To give it to friends later, dispatch again with promote_android $BUILD." >> "$GITHUB_STEP_SUMMARY"

  promote:
    if: inputs.promote_ios != '' || inputs.promote_android != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Give the TestFlight build to friends
        if: inputs.promote_ios != ''
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUILD: ${{ inputs.promote_ios }}
        run: node scripts/testflight.mjs friends "$BUILD"
      - name: Give the Firebase release to friends
        if: inputs.promote_android != ''
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase.json
          BUILD: ${{ inputs.promote_android }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          scripts/firebase-distribution.sh promote "$BUILD"
