name: CI
on:
  workflow_call:
    inputs:
      copy:
        description: Proof copy suffix; empty for ordinary CI
        type: string
        default: ""
  push:
    # release/* branches run CI on push because the release gate ships a commit
    # only once ci.yml's checks are green for that exact SHA, and it reads a
    # push-event run. Without this, dispatching mobile-release.yml on a release
    # branch cannot supply a completed run for that commit.
    branches: [main, feat/expo-native, "release/*"]
  # Draft pull requests run only the fast checks and the Android build; the
  # device lanes run once the pull request is ready for review.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Nightly run: the audit, which gates pull requests and pushes only when
    # they change dependencies, catches newly disclosed CVEs against the pinned
    # lockfile, and the iOS flow lane, which pull requests run only when their
    # iOS fingerprint changes, covers main.
    - cron: "0 6 * * *"
permissions:
  contents: read
# github.ref is refs/heads/main for every push, so consecutive main pushes
# shared one group and cancelled each other. Four pushes in 41 seconds left only
# the first and last running. PR refs use refs/pull/N/merge and were not part of
# the main collision. Scope PR runs to the PR number and other runs to the commit
# SHA, so only runs of the identical commit collide. Every Dependabot commit now
# runs full CI instead of coalescing a burst. The repository is public, so
# Actions minutes are free and that cost is acceptable.
# The event name is also part of the group: the nightly schedule run and a push
# landing on the same commit both resolve to the same SHA, and without the
# event name the schedule run would cancel a same-commit push run in progress.
# The ref is in the group for the same reason: a release branch cut from a main
# commit pushes that SHA a second time, and without the ref that push would
# cancel main's run and leave the commit's required checks cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}${{ inputs.copy && format('-{0}-{1}-{2}', github.run_id, github.run_attempt, inputs.copy) || '' }}
  cancel-in-progress: ${{ !inputs.copy }}
jobs:
  fingerprint:
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.native.outputs.android }}
      devices: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
      ios: ${{ steps.native.outputs.ios }}
      ios-owed: ${{ steps.ios-owed.outputs.owed }}
      user-facing: ${{ steps.changes.outputs.user-facing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - id: native
        name: Compute native fingerprints
        env:
          ANDROID_ARCHITECTURES: arm64-v8a,x86_64
          APP_VERSION: 9.9.9
          BUILD_NUMBER: "42"
          CONFIGURATION: Release
          EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
          XCODE_PATH: /Applications/Xcode_26.6.app
        run: |
          android=$(pnpm exec node scripts/native-fingerprint.mjs android)
          ios=$(pnpm exec node scripts/native-fingerprint.mjs ios)
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
      - id: ios-owed
        name: Owe the iOS lane unless its last run on this branch passed
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          LANE: >-
            [.jobs[] | select(.name | test("^(native-e2e-ios-light|ui-screenshots-ios-dark)"))]
            | if all(.conclusion == "skipped") then "skipped" else any(.conclusion != "success") end
        run: |
          owed=true
          while read -r run; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --jq "$LANE")
            if [ "$state" != skipped ]; then
              owed=$state
              break
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$BRANCH&status=completed&per_page=50" --jq '.workflow_runs[].id')
          echo "owed=$owed" >> "$GITHUB_OUTPUT"
      - id: changes
        name: Check for user-facing changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          USER_FACING: ^(packages/native/(src|app|assets)|packages/core/src|patches|\.maestro|scripts/mock-trakt)/|^(packages/native/(entry\.ts|babel\.config\.js|metro\.config\.js)|pnpm-lock\.yaml|\.github/workflows/ci\.yml)$|^scripts/(gather-pr-media\.sh|compare-screenshots\.mjs|attach-pr-media\.sh|start-ready-process\.mjs|download-ci-artifact\.sh|reembed-ios\.sh|compile-hermes\.sh|prepare-ios-ui\.sh|wait-ios-ready\.mjs|maestro-(test\.sh|supervisor\.mjs|failure\.mjs))$
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if grep -qE "$USER_FACING" <<< "$files"; then
            echo "user-facing=true" >> "$GITHUB_OUTPUT"
          fi
  check:
    if: ${{ !inputs.copy }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      js-bundles: ${{ steps.js-bundles.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm check
      - name: Upload JavaScript bundles
        id: js-bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cue-js-bundles
          path: |
            packages/native/.expo/atlas.jsonl
            packages/native/dist/
          retention-days: 30
      - name: Gate changed core coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq .body)
          node scripts/check-changed-coverage.mjs "origin/$BASE_REF" coverage/lcov.info "$PR_BODY"
  render-performance:
    if: ${{ !inputs.copy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Measure base and head consecutively
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          EXPO_PUBLIC_TRAKT_CLIENT_ID: test-client
        run: |
          BASE_SHA=$(scripts/measured-base.sh "$EVENT_NAME" "$PUSH_BEFORE")
          if git show "$BASE_SHA:packages/native/package.json" 2>/dev/null | grep -q '"perf:render"'; then
            base_directory="$RUNNER_TEMP/render-base"
            git worktree add --detach "$base_directory" "$BASE_SHA"
            pnpm --dir "$base_directory" install --frozen-lockfile
            (cd "$base_directory" && pnpm --dir packages/native perf:render --baseline --compare=false)
            mkdir -p packages/native/.reassure
            cp "$base_directory/packages/native/.reassure/baseline.perf" \
              packages/native/.reassure/baseline.perf
          fi
          pnpm --dir packages/native perf:render
      - name: Gate render counts
        run: pnpm check:render-counts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: reassure-render-performance
          path: packages/native/.reassure/
          include-hidden-files: true
          retention-days: 7
  audit:
    if: ${{ !inputs.copy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Audit production dependencies, gating only dependency changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: scripts/audit-dependencies.sh "$EVENT_NAME" "$PUSH_BEFORE"
  actionlint:
    if: ${{ !inputs.copy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12 # v1.7.12
  footprint:
    # The footprint needs only the published bundles and Android sizes, so a
    # later gate failing in check must not suppress the pull request comment.
    if: >-
      !cancelled() && needs.check.outputs.js-bundles != '' && needs.native-android.result == 'success' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/expo-native')))
    permissions:
      actions: read
      contents: read
      pull-requests: write
    needs: [check, native-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cue-js-bundles
          path: packages/native
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cue-native-android-sizes
          path: ${{ runner.temp }}/native-android-sizes
      - name: Restore the base measurement
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE_SHA=$(scripts/measured-base.sh pull_request)
          scripts/restore-base-metrics.sh "$BASE_SHA"
      - name: Measure delivered artifacts
        run: |
          scripts/measure-sizes.sh packages/native "$PWD/head-sizes.json"
          jq -s 'add' head-sizes.json \
            "$RUNNER_TEMP/native-android-sizes/head-android-sizes.json" > all-head-sizes.json
          mv all-head-sizes.json head-sizes.json
          jq -n --slurpfile sizes head-sizes.json '{sizes: $sizes[0]}' > head-metrics.json
      - name: Measure the diff footprint
        id: diff
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq .body)
          export PR_BODY
          status=0
          scripts/diff-footprint.sh "origin/$BASE_REF" base-metrics.json head-metrics.json \
            > footprint.md 2> footprint-gates.txt || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload Expo Atlas
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expo-atlas
          path: packages/native/.expo/atlas.jsonl
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cue-footprint-${{ github.event.pull_request.head.sha || github.sha }}
          path: head-metrics.json
          retention-days: 30
      - name: Update the pull request comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          comments_url="repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
          comment_ids=$(gh api --paginate "$comments_url" --jq '.[] | select(.body | startswith("<!-- diff-footprint -->")) | .id')
          for comment_id in $comment_ids; do
            gh api --method DELETE "repos/${{ github.repository }}/issues/comments/$comment_id"
          done
          gh api --method POST "$comments_url" -F body=@footprint.md
      - name: Enforce the footprint gates
        if: steps.diff.outputs.status != '' && steps.diff.outputs.status != '0'
        run: |
          cat footprint-gates.txt >&2
          exit 1
  native-ios:
    # A cold build measured up to 58 minutes; a cached one about 2.
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    needs: fingerprint
    if: needs.fingerprint.outputs.devices == 'true'
    runs-on: macos-26
    outputs:
      hit: ${{ steps.native-cache.outputs.hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: ./.github/actions/setup-node-pnpm
      - id: native-cache
        name: Restore the fingerprinted simulator app
        env:
          ARTIFACT_NAME: cue-native-ios-${{ needs.fingerprint.outputs.ios }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if scripts/download-ci-artifact.sh "$ARTIFACT_NAME" "$RUNNER_TEMP/native-ios-app" native-ios; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            tar -xzf "$RUNNER_TEMP/native-ios-app/Cue.app.tgz" -C "$RUNNER_TEMP/native-ios-app"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.native-cache.outputs.hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ${{ runner.temp }}/native-ios-derived-data
          key: ios-build-${{ runner.os }}-xcode-26.6-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.native-cache.outputs.hit != 'true'
        run: pnpm --filter @cue/native exec expo prebuild --platform ios --clean --no-install
        env:
          CONFIGURATION: Release
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
      - if: steps.native-cache.outputs.hit != 'true'
        name: Check the generated iOS privacy configuration
        run: scripts/verify-ios-privacy.sh packages/native/ios/Cue/Info.plist packages/native/ios/Cue/Cue.entitlements Release
      - if: steps.native-cache.outputs.hit != 'true'
        run: pnpm --filter @cue/native exec expo prebuild --platform ios --clean
        env:
          CONFIGURATION: Release
          EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
      - if: steps.native-cache.outputs.hit != 'true'
        name: Check the harness transport exception
        run: scripts/verify-ios-privacy.sh packages/native/ios/Cue/Info.plist packages/native/ios/Cue/Cue.entitlements Release 127.0.0.1
      - if: steps.native-cache.outputs.hit != 'true'
        name: Build the app for the simulator
        working-directory: packages/native/ios
        env:
          EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
          EXPO_PUBLIC_UI_HARNESS: "1"
          EXPO_PUBLIC_CLOCK_START: "2026-10-15T00:00:00.000Z"
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
        run: |
          xcodebuild -workspace Cue.xcworkspace -scheme Cue \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/native-ios-derived-data" build
          mkdir -p "$RUNNER_TEMP/native-ios-app"
          ditto "$RUNNER_TEMP/native-ios-derived-data/Build/Products/Release-iphonesimulator/Cue.app" \
            "$RUNNER_TEMP/native-ios-app/Cue.app"
      - if: steps.native-cache.outputs.hit == 'true'
        name: Embed current JavaScript and assets
        env:
          EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
          EXPO_PUBLIC_UI_HARNESS: "1"
          EXPO_PUBLIC_CLOCK_START: "2026-10-15T00:00:00.000Z"
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
        run: scripts/reembed-ios.sh "$RUNNER_TEMP/native-ios-app/Cue.app"
      - name: Validate and package the simulator app
        run: |
          app="$RUNNER_TEMP/native-ios-app/Cue.app"
          LC_ALL=C grep -aq 'http://127.0.0.1:8787' "$app/main.jsbundle"
          LC_ALL=C grep -aq 'application-identifier' "$app/Cue"
          while IFS= read -r framework; do
            test -d "$app/Frameworks/$framework" || {
              echo "Missing embedded framework: $framework" >&2
              exit 1
            }
          done < <(
            {
              otool -L "$app/Cue"
              for bundle in "$app"/Frameworks/*.framework; do
                executable=${bundle##*/}
                otool -L "$bundle/${executable%.framework}"
              done
            } | awk '$1 ~ /^@rpath\/.*\.framework\// { split($1, path, "/"); print path[2] }' | sort -u
          )
          tar -czf "$RUNNER_TEMP/native-ios-app/Cue.app.tgz" -C "$RUNNER_TEMP/native-ios-app" Cue.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cue-native-ios-${{ needs.fingerprint.outputs.ios }}${{ inputs.copy }}
          path: ${{ runner.temp }}/native-ios-app/Cue.app.tgz
          retention-days: 30
  native-e2e-ios-light:
    timeout-minutes: 22
    permissions:
      actions: read
      contents: read
    needs: [fingerprint, native-ios]
    if: github.event_name != 'pull_request' || needs.native-ios.outputs.hit != 'true' || needs.fingerprint.outputs.ios-owed == 'true' || needs.fingerprint.outputs.user-facing == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        suite: [detail, activity, discovery]
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Boot the simulator
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          device_id=$(xcrun simctl list devices available -j | \
            jq -er '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid // empty')
          xcrun simctl boot "$device_id"
          echo "DEVICE_ID=$device_id" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cue-native-ios-${{ needs.fingerprint.outputs.ios }}${{ inputs.copy }}
          path: ${{ runner.temp }}/native-ios-app
      - name: Cache Maestro CLI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/maestro
          key: maestro-${{ runner.os }}-${{ runner.arch }}-2.10.0-29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
      - name: Start the fake Trakt server
        run: node scripts/start-ready-process.mjs scripts/mock-trakt/server.mjs "$RUNNER_TEMP/mock-trakt.log"
      - name: Prepare the simulator and cached app
        run: scripts/prepare-ios-ui.sh "$RUNNER_TEMP/native-ios-app" light
      - name: Run the shared light flow
        run: |
          output="$RUNNER_TEMP/screenshots/ios/light/${{ matrix.suite }}"
          mkdir -p "$output"
          bash scripts/maestro-test.sh --device "$DEVICE_ID" test --debug-output "$RUNNER_TEMP/maestro-debug/${{ matrix.suite }}" \
            ".maestro/ci/app-${{ matrix.suite }}.yaml" \
            --format JUNIT \
            --output "$RUNNER_TEMP/maestro-results-${{ matrix.suite }}.xml" \
            --test-output-dir "$output"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ui-screenshots-ios-light-${{ matrix.suite }}${{ inputs.copy }}
          path: ${{ runner.temp }}/screenshots/ios/light/${{ matrix.suite }}/**/takeScreenshot/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: native-e2e-ios-light-${{ matrix.suite }}${{ inputs.copy }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/maestro-debug/
            ${{ runner.temp }}/maestro-results-*.xml
            ${{ runner.temp }}/mock-trakt.log
            ${{ runner.temp }}/screenshots/
            !${{ runner.temp }}/screenshots/**/takeScreenshot/*.png
          retention-days: 7
  native-e2e:
    permissions:
      contents: read
    needs: [fingerprint, native-ios, native-e2e-ios-light]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require passing iOS light shards unless the pull request skipped them
        env:
          EVENT: ${{ github.event_name }}
          BUILD: ${{ needs.native-ios.result }}
          DEVICES: ${{ needs.fingerprint.outputs.devices }}
          HIT: ${{ needs.native-ios.outputs.hit }}
          OWED: ${{ needs.fingerprint.outputs.ios-owed }}
          SHARDS: ${{ needs.native-e2e-ios-light.result }}
          USER_FACING: ${{ needs.fingerprint.outputs.user-facing }}
        run: node scripts/native-e2e-rollup.mjs
  ui-screenshots-ios-dark:
    # Measured 10 to 16 minutes, including a 4 minute simulator setup.
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    needs: [fingerprint, native-ios]
    if: github.event_name != 'pull_request' || needs.native-ios.outputs.hit != 'true' || needs.fingerprint.outputs.ios-owed == 'true' || needs.fingerprint.outputs.user-facing == 'true'
    runs-on: macos-26
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Boot the simulator
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          device_id=$(xcrun simctl list devices available -j | \
            jq -er '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid // empty')
          xcrun simctl boot "$device_id"
          echo "DEVICE_ID=$device_id" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cue-native-ios-${{ needs.fingerprint.outputs.ios }}${{ inputs.copy }}
          path: ${{ runner.temp }}/native-ios-app
      - name: Cache Maestro CLI
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/maestro
