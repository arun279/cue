          profile: pixel_7_pro
          script: bash scripts/verify-android-ui.sh "$RUNNER_TEMP/cue-native-android/universal.apk" "$RUNNER_TEMP/android-ui" "$RUNNER_TEMP/screenshots/android" light
      - name: Create Android contact sheet
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y imagemagick
          scripts/create-ui-contact-sheet.sh "$RUNNER_TEMP/screenshots/android/light" android light
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ui-screenshots-android-light
          path: ${{ runner.temp }}/screenshots/android/light
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: android-e2e-light
          path: ${{ runner.temp }}/android-ui
          if-no-files-found: error
          retention-days: 7
