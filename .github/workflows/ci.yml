name: CI
on:
  push:
    # release/* branches run CI on push because the release gate ships a commit
    # only once ci.yml's checks are green for that exact SHA, and it reads a
    # push-event run. Without this, dispatching mobile-release.yml on a release
    # branch waits out its deadline on checks that would never report.
    branches: [main, "release/*"]
  pull_request:
  schedule:
    # Weekly re-run so the (non-deterministic) advisory audit catches newly
    # disclosed CVEs against the pinned lockfile without gating everyday commits.
    - cron: "0 6 * * 1"
permissions:
  contents: read
# github.ref is refs/heads/main for every push, so consecutive main pushes
# shared one group and cancelled each other. Four pushes in 41 seconds left only
# the first and last running. PR refs use refs/pull/N/merge and were not part of
# the main collision. Scope PR runs to the PR number and other runs to the commit
# SHA, so only runs of the identical commit collide. Every Dependabot commit now
# runs full CI instead of coalescing a burst. The repository is public, so
# Actions minutes are free and that cost is acceptable.
# The event name is also part of the group: the weekly schedule run and a push
# landing on the same commit both resolve to the same SHA, and without the
# event name the schedule run would cancel a same-commit push run in progress.
# The ref is in the group for the same reason: a release branch cut from a main
# commit pushes that SHA a second time, and without the ref that push would
# cancel main's run and leave the commit's required checks cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  fingerprint:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.native.outputs.android }}
      ios: ${{ steps.native.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - id: native
        name: Compute native fingerprints
        env:
          ANDROID_ARCHITECTURES: arm64-v8a,x86_64
          APP_VERSION: 9.9.9
          BUILD_NUMBER: "42"
          CONFIGURATION: Release
          EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
          XCODE_PATH: /Applications/Xcode_26.6.app
        run: |
          echo "android=$(node scripts/native-fingerprint.mjs android)" >> "$GITHUB_OUTPUT"
          echo "ios=$(node scripts/native-fingerprint.mjs ios)" >> "$GITHUB_OUTPUT"
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm check
        env:
          EXPO_ATLAS: "true"
      - name: Upload JavaScript bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cue-js-bundles
          path: |
            packages/native/.expo/atlas.jsonl
            packages/native/dist/
          retention-days: 1
  render-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Measure render performance
        env:
          EXPO_PUBLIC_TRAKT_CLIENT_ID: test-client
        run: pnpm --dir packages/native perf:render --compare=false
      - name: Gate render counts and report duration
        run: pnpm check:render-counts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: reassure-render-performance
          path: packages/native/.reassure/current.perf
          retention-days: 7
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm audit --prod --audit-level=high
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12 # v1.7.12
  standardrb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true
      - run: bundle exec standardrb fastlane/Fastfile fastlane/Appfile
  footprint:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    permissions:
      actions: read
      contents: read
      pull-requests: write
    needs: [check, native-android, native-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cue-js-bundles
          path: packages/native
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cue-native-ios-sizes
          path: ${{ runner.temp }}/native-ios-sizes
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cue-native-android-sizes
          path: ${{ runner.temp }}/native-android-sizes
      - name: Restore the base measurement
        env:
          ARTIFACT_NAME: cue-footprint-${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if scripts/download-ci-artifact.sh "$ARTIFACT_NAME" "$RUNNER_TEMP/base-metrics"; then
            cp "$RUNNER_TEMP/base-metrics/head-metrics.json" base-metrics.json
          else
            jq -n '{sizes: null, complexity: null, comments: null}' > base-metrics.json
          fi
      - name: Measure the diff footprint
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          scripts/measure-sizes.sh "$PWD/head-sizes.json"
          jq -s 'add' head-sizes.json \
            "$RUNNER_TEMP/native-ios-sizes/head-ios-sizes.json" \
            "$RUNNER_TEMP/native-android-sizes/head-android-sizes.json" > all-head-sizes.json
          mv all-head-sizes.json head-sizes.json
          jq -n --slurpfile sizes head-sizes.json '{sizes: $sizes[0]}' > head-metrics.json
          scripts/diff-footprint.sh "origin/$BASE_REF" base-metrics.json head-metrics.json \
            > footprint.md
      - name: Upload Expo Atlas
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expo-atlas
          path: packages/native/.expo/atlas.jsonl
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cue-footprint-${{ github.event.pull_request.head.sha }}
          path: head-metrics.json
          retention-days: 30
      - name: Update the pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          comments_url="repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
          comment_ids=$(gh api --paginate "$comments_url" --jq '.[] | select(.body | startswith("<!-- diff-footprint -->")) | .id')
          for comment_id in $comment_ids; do
            gh api --method DELETE "repos/${{ github.repository }}/issues/comments/$comment_id"
          done
          gh api --method POST "$comments_url" -F body=@footprint.md
      - name: Check size deltas
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-size-delta.mjs base-metrics.json head-metrics.json "$PR_BODY"
  native-ios:
    permissions:
      actions: read
      contents: read
    needs: fingerprint
    runs-on: macos-26
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - id: simulator
        name: Start an available iPhone simulator
        run: |
          device_id=$(xcrun simctl list devices available -j | \
            jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$device_id"
          xcrun simctl boot "$device_id"
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: ./.github/actions/setup-node-pnpm
      - name: Install Maestro 2.10.0
        run: |
          curl -fsSL \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip \
            -o "$RUNNER_TEMP/maestro.zip"
          echo "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  $RUNNER_TEMP/maestro.zip" \
            | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - id: native-cache
        name: Restore the fingerprinted simulator app
        env:
          ARTIFACT_NAME: cue-native-ios-${{ needs.fingerprint.outputs.ios }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if scripts/download-ci-artifact.sh "$ARTIFACT_NAME" "$RUNNER_TEMP/native-ios-app" native-ios; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            tar -xzf "$RUNNER_TEMP/native-ios-app/Cue.app.tgz" -C "$RUNNER_TEMP/native-ios-app"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.native-cache.outputs.hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ${{ runner.temp }}/native-ios-derived-data
          key: ios-build-${{ runner.os }}-xcode-26.6-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.native-cache.outputs.hit != 'true'
        run: pnpm --filter @cue/native exec expo prebuild --platform ios --clean --no-install
        env:
          CONFIGURATION: Release
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
      - if: steps.native-cache.outputs.hit != 'true'
        name: Check the generated iOS privacy configuration
        run: scripts/verify-ios-privacy.sh packages/native/ios/Cue/Info.plist packages/native/ios/Cue/Cue.entitlements Release
      - if: steps.native-cache.outputs.hit != 'true'
        run: pnpm --filter @cue/native exec expo prebuild --platform ios --clean
        env:
          CONFIGURATION: Release
          EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
      - if: steps.native-cache.outputs.hit != 'true'
        name: Check the harness transport exception
        run: scripts/verify-ios-privacy.sh packages/native/ios/Cue/Info.plist packages/native/ios/Cue/Cue.entitlements Release 127.0.0.1
      - if: steps.native-cache.outputs.hit != 'true'
        name: Build the app for the simulator
        working-directory: packages/native/ios
        env:
          EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
        run: |
          xcodebuild -workspace Cue.xcworkspace -scheme Cue \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/native-ios-derived-data" build
          mkdir -p "$RUNNER_TEMP/native-ios-app"
          ditto "$RUNNER_TEMP/native-ios-derived-data/Build/Products/Release-iphonesimulator/Cue.app" \
            "$RUNNER_TEMP/native-ios-app/Cue.app"
      - if: steps.native-cache.outputs.hit == 'true'
        name: Embed current JavaScript and assets
        env:
          EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
        run: scripts/reembed-ios.sh "$RUNNER_TEMP/native-ios-app/Cue.app"
      - name: Validate and package the simulator app
        run: |
          app="$RUNNER_TEMP/native-ios-app/Cue.app"
          LC_ALL=C grep -aq 'http://127.0.0.1:8787' "$app/main.jsbundle"
          LC_ALL=C grep -aq 'application-identifier' "$app/Cue"
          while IFS= read -r framework; do
            test -d "$app/Frameworks/$framework" || {
              echo "Missing embedded framework: $framework" >&2
              exit 1
            }
          done < <(
            {
              otool -L "$app/Cue"
              for bundle in "$app"/Frameworks/*.framework; do
                executable=${bundle##*/}
                otool -L "$bundle/${executable%.framework}"
              done
            } | awk '$1 ~ /^@rpath\/.*\.framework\// { split($1, path, "/"); print path[2] }' | sort -u
          )
          app_size=$(find "$app" -type f -exec stat -f '%z' {} + | awk '{ total += $1 } END { print total + 0 }')
          jq -n --argjson size "$app_size" \
            '[{name: "iOS Release simulator app files", size: $size, sizeLimit: null, configuration: "generic iOS Simulator"}]' \
            > "$RUNNER_TEMP/head-ios-sizes.json"
          tar -czf "$RUNNER_TEMP/native-ios-app/Cue.app.tgz" -C "$RUNNER_TEMP/native-ios-app" Cue.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cue-native-ios-${{ needs.fingerprint.outputs.ios }}
          path: ${{ runner.temp }}/native-ios-app/Cue.app.tgz
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: cue-native-ios-sizes
          path: ${{ runner.temp }}/head-ios-sizes.json
          retention-days: 1
      - name: Install the app
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$RUNNER_TEMP/native-ios-app/Cue.app"
      - name: Start the fake Trakt
        run: |
          node scripts/mock-trakt/server.mjs > "$RUNNER_TEMP/mock-trakt.log" 2>&1 &
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/users/settings > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Run launch and startup flows
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          startup_ceiling_ms=$(jq -r .ceilingMs .startup-time-limit.json)
          maestro --device "$DEVICE_ID" test .maestro/ci/ios.yaml \
            --env STARTUP_CEILING_MS="$startup_ceiling_ms" \
            --format JUNIT \
            --output "$RUNNER_TEMP/maestro-results.xml" \
            --debug-output "$RUNNER_TEMP/maestro-debug" \
            --test-output-dir "$RUNNER_TEMP/maestro-tests"
      - name: Summarize startup timing
        if: ${{ !cancelled() }}
        run: |
          node scripts/summarize-startup-timing.mjs \
            "$RUNNER_TEMP/maestro-tests" \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: native-e2e
          path: |
            ${{ runner.temp }}/maestro-debug/
            ${{ runner.temp }}/maestro-tests/
            ${{ runner.temp }}/maestro-results.xml
            ${{ runner.temp }}/mock-trakt.log
          retention-days: 7
  native-e2e:
    needs: native-ios
    runs-on: ubuntu-latest
    steps:
      - run: echo "Native E2E completed in native-ios."
  native-android:
    permissions:
      actions: read
      contents: read
    needs: fingerprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - id: native-cache
        name: Restore the fingerprinted Android artifacts
        env:
          ARTIFACT_NAME: cue-native-android-${{ needs.fingerprint.outputs.android }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if scripts/download-ci-artifact.sh "$ARTIFACT_NAME" "$RUNNER_TEMP/native-android" native-android && \
            unzip -Z1 "$RUNNER_TEMP/native-android/universal.apk" | \
              grep -q '^lib/x86_64/libreactnative\.so$'; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.native-cache.outputs.hit != 'true'
        run: pnpm --filter @cue/native exec expo prebuild --platform android --clean
        env:
          APP_VERSION: 9.9.9
          BUILD_NUMBER: "42"
          EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/native/android/gradle/wrapper/gradle-wrapper.properties
            packages/native/android/**/*.gradle*
      - name: Download bundletool
        env:
          BUNDLETOOL_VERSION: "1.18.3"
          BUNDLETOOL_SHA256: "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Build release artifacts
        if: steps.native-cache.outputs.hit != 'true'
        working-directory: packages/native/android
        env:
          EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
        run: |
          ./gradlew --build-cache --configuration-cache --configuration-cache-problems=warn bundleRelease \
            -PreactNativeArchitectures=arm64-v8a,x86_64
          ./gradlew --build-cache --configuration-cache --configuration-cache-problems=warn assembleRelease \
            -PreactNativeArchitectures=arm64-v8a
          mkdir -p "$RUNNER_TEMP/native-android"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/native-android/"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/native-android/tester-arm64-v8a.apk"
          cp app/debug.keystore "$RUNNER_TEMP/native-android/"
      - if: steps.native-cache.outputs.hit == 'true'
        name: Embed current Android JavaScript
        env:
          EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
        run: |
          scripts/reembed-android.sh \
            "$RUNNER_TEMP/native-android/app-release.aab" \
            "$RUNNER_TEMP/native-android/tester-arm64-v8a.apk" \
            "$RUNNER_TEMP/native-android/debug.keystore"
      - name: Build and check release artifacts
        env:
          PLAY_SIZE_MEASUREMENT_BYTES: "16920872"
          PLAY_SIZE_MEASURED_ON: "2026-09-09"
          PLAY_SIZE_LIMIT_BYTES: "20000000"
        run: |
          cd "$RUNNER_TEMP/native-android"
          aab=app-release.aab
          echo '{"supportedAbis":["arm64-v8a"],"supportedLocales":["en"],"screenDensity":640,"sdkVersion":35}' > device.json
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$aab" --output=all.apks --overwrite
          java -jar "$RUNNER_TEMP/bundletool.jar" get-size total \
            --apks=all.apks --device-spec=device.json > play-size.csv
          node "$GITHUB_WORKSPACE/scripts/bundletool-size.mjs" \
            play-size.csv "$PLAY_SIZE_LIMIT_BYTES" "Play download at XXXHDPI ARMv8"
          java -jar "$RUNNER_TEMP/bundletool.jar" get-size total \
            --apks=all.apks --dimensions=ALL > all-size.csv
          node "$GITHUB_WORKSPACE/scripts/bundletool-size.mjs" \
            all-size.csv "$PLAY_SIZE_LIMIT_BYTES" "Play download maximum across all configurations"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$aab" --output=universal.apks --overwrite --mode=universal \
            --ks=debug.keystore --ks-pass=pass:android \
            --ks-key-alias=androiddebugkey --key-pass=pass:android
          unzip -qo universal.apks universal.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify universal.apk
          "$GITHUB_WORKSPACE/scripts/verify-apk.sh" universal.apk 42 9.9.9
          "$apksigner" verify tester-arm64-v8a.apk
          "$GITHUB_WORKSPACE/scripts/verify-apk.sh" tester-arm64-v8a.apk 42 9.9.9 arm64-v8a
          tester_limit=$(jq -r \
            '.[] | select(.name == "Firebase tester APK file") | .limit' \
            "$GITHUB_WORKSPACE/.size-limit.json")
          node "$GITHUB_WORKSPACE/scripts/assert-file-size.mjs" tester-arm64-v8a.apk \
            "$tester_limit" "Firebase tester APK file (arm64-v8a, all densities)"
          tester_size=$(wc -c < tester-arm64-v8a.apk | tr -d ' ')
          play_size=$(node "$GITHUB_WORKSPACE/scripts/bundletool-size.mjs" play-size.csv --value-only)
          jq -n --argjson tester "$tester_size" --argjson play "$play_size" \
            '[
              {name: "Firebase tester APK file", size: $tester, sizeLimit: 40000000, configuration: "arm64-v8a, all densities"},
              {name: "Play download estimate", size: $play, sizeLimit: 20000000, configuration: "XXXHDPI arm64-v8a, English, Android 15"}
            ]' > "$RUNNER_TEMP/head-android-sizes.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cue-native-android-${{ needs.fingerprint.outputs.android }}
          path: |
            ${{ runner.temp }}/native-android/app-release.aab
            ${{ runner.temp }}/native-android/debug.keystore
            ${{ runner.temp }}/native-android/tester-arm64-v8a.apk
            ${{ runner.temp }}/native-android/universal.apk
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: cue-native-android-sizes
          path: ${{ runner.temp }}/head-android-sizes.json
          retention-days: 1
  android-e2e:
    timeout-minutes: 8
    needs: [fingerprint, native-android]
    runs-on: ubuntu-latest
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Maestro 2.10.0
        run: |
          curl -fsSL \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip \
            -o "$RUNNER_TEMP/maestro.zip"
          echo "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  $RUNNER_TEMP/maestro.zip" \
            | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cue-native-android-${{ needs.fingerprint.outputs.android }}
          path: ${{ runner.temp }}/cue-native-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Inspect the release UI
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7_pro
          script: bash scripts/verify-android-ui.sh "$RUNNER_TEMP/cue-native-android/universal.apk" "$RUNNER_TEMP/android-ui"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: android-e2e
          path: ${{ runner.temp }}/android-ui
          if-no-files-found: error
          retention-days: 7
