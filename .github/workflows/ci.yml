  native-android:
    permissions:
      actions: read
      contents: read
    needs: fingerprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - id: native-cache
        name: Restore the fingerprinted Android artifacts
        env:
          ARTIFACT_NAME: cue-native-android-${{ needs.fingerprint.outputs.android }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if scripts/download-ci-artifact.sh "$ARTIFACT_NAME" "$RUNNER_TEMP/native-android" native-android && \
            unzip -Z1 "$RUNNER_TEMP/native-android/universal.apk" | \
              grep -q '^lib/x86_64/libreactnative\.so$'; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.native-cache.outputs.hit != 'true'
        run: pnpm --filter @cue/native exec expo prebuild --platform android --clean
        env:
          APP_VERSION: 9.9.9
          BUILD_NUMBER: "42"
          EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/native/android/gradle/wrapper/gradle-wrapper.properties
            packages/native/android/**/*.gradle*
      - name: Download bundletool
        env:
          BUNDLETOOL_VERSION: "1.18.3"
          BUNDLETOOL_SHA256: "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"
        run: |
          curl --fail --location \
            --output "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Build release artifacts
        if: steps.native-cache.outputs.hit != 'true'
        working-directory: packages/native/android
        env:
          EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
          EXPO_PUBLIC_UI_HARNESS: "1"
          EXPO_PUBLIC_CLOCK_START: "2026-10-15T00:00:00.000Z"
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
        run: |
          ./gradlew --build-cache --configuration-cache --configuration-cache-problems=warn bundleRelease \
            -PreactNativeArchitectures=arm64-v8a,x86_64
          ./gradlew --build-cache --configuration-cache --configuration-cache-problems=warn assembleRelease \
            -PreactNativeArchitectures=arm64-v8a
          mkdir -p "$RUNNER_TEMP/native-android"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/native-android/"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/native-android/tester-arm64-v8a.apk"
          cp app/debug.keystore "$RUNNER_TEMP/native-android/"
      - if: steps.native-cache.outputs.hit == 'true'
        name: Embed current Android JavaScript
        env:
          EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
          EXPO_PUBLIC_UI_HARNESS: "1"
          EXPO_PUBLIC_CLOCK_START: "2026-10-15T00:00:00.000Z"
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
        run: |
          scripts/reembed-android.sh \
            "$RUNNER_TEMP/native-android/app-release.aab" \
            "$RUNNER_TEMP/native-android/tester-arm64-v8a.apk" \
            "$RUNNER_TEMP/native-android/debug.keystore"
      - name: Build and check release artifacts
        run: |
          cd "$RUNNER_TEMP/native-android"
          aab=app-release.aab
          echo '{"supportedAbis":["arm64-v8a"],"supportedLocales":["en"],"screenDensity":640,"sdkVersion":35}' > device.json
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$aab" --output=all.apks --overwrite
          java -jar "$RUNNER_TEMP/bundletool.jar" get-size total \
            --apks=all.apks --device-spec=device.json > play-size.csv
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$aab" --output=universal.apks --overwrite --mode=universal \
            --ks=debug.keystore --ks-pass=pass:android \
            --ks-key-alias=androiddebugkey --key-pass=pass:android
          unzip -qo universal.apks universal.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify universal.apk
          "$GITHUB_WORKSPACE/scripts/verify-apk.sh" universal.apk 42 9.9.9
          "$apksigner" verify tester-arm64-v8a.apk
          "$GITHUB_WORKSPACE/scripts/verify-apk.sh" tester-arm64-v8a.apk 42 9.9.9 arm64-v8a
          tester_size=$(wc -c < tester-arm64-v8a.apk | tr -d ' ')
          play_size=$(node "$GITHUB_WORKSPACE/scripts/bundletool-size.mjs" play-size.csv --value-only)
          jq -n --argjson tester "$tester_size" --argjson play "$play_size" \
            '[
              {name: "Firebase tester APK file", size: $tester, configuration: "arm64-v8a, all densities"},
              {name: "Play download estimate", size: $play, configuration: "XXXHDPI arm64-v8a, English, Android 15"}
            ]' > "$RUNNER_TEMP/head-android-sizes.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cue-native-android-${{ needs.fingerprint.outputs.android }}${{ inputs.copy }}
          path: |
            ${{ runner.temp }}/native-android/app-release.aab
            ${{ runner.temp }}/native-android/debug.keystore
            ${{ runner.temp }}/native-android/tester-arm64-v8a.apk
            ${{ runner.temp }}/native-android/universal.apk
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/expo-native'
        with:
          name: cue-native-android-sizes${{ inputs.copy }}
          path: ${{ runner.temp }}/head-android-sizes.json
          retention-days: 30
  android-e2e:
    # The emulator and the full flow suite measured 11.3 minutes; the timeout
    # is that plus about 25 percent.
    timeout-minutes: 14
    needs: [fingerprint, native-android]
    if: needs.fingerprint.outputs.devices == 'true'
    runs-on: ubuntu-latest
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Maestro 2.10.0
        run: |
          curl -fsSL \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip \
            -o "$RUNNER_TEMP/maestro.zip"
          echo "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  $RUNNER_TEMP/maestro.zip" \
            | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cue-native-android-${{ needs.fingerprint.outputs.android }}${{ inputs.copy }}
          path: ${{ runner.temp }}/cue-native-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Inspect the release UI
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/verify-android-ui.sh "$RUNNER_TEMP/cue-native-android/universal.apk" "$RUNNER_TEMP/android-ui" "$RUNNER_TEMP/screenshots/android" light
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ui-screenshots-android-light${{ inputs.copy }}
          path: ${{ runner.temp }}/screenshots/android/light/**/takeScreenshot/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: android-e2e-light${{ inputs.copy }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/android-ui
            ${{ runner.temp }}/screenshots/
            !${{ runner.temp }}/screenshots/**/takeScreenshot/*.png
          if-no-files-found: error
          retention-days: 7
