          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cue-native-android-${{ needs.native-android.outputs.fingerprint }}${{ inputs.copy }}
          path: ${{ runner.temp }}/cue-native-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ./.github/actions/android-emulator
      - name: Inspect the release UI
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/verify-android-ui.sh "$RUNNER_TEMP/cue-native-android/universal.apk" "$RUNNER_TEMP/android-ui" "$RUNNER_TEMP/screenshots/android" dark
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ui-screenshots-android-dark${{ inputs.copy }}
          path: ${{ runner.temp }}/screenshots/android/dark/**/takeScreenshot/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: android-e2e-dark${{ inputs.copy }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/android-ui
            ${{ runner.temp }}/screenshots/
            !${{ runner.temp }}/screenshots/**/takeScreenshot/*.png
          if-no-files-found: error
          retention-days: 7
  pr-media:
    timeout-minutes: 5
    if: >-
      !cancelled() && github.event_name == 'pull_request' && needs.fingerprint.outputs.devices == 'true' &&
      needs.fingerprint.outputs.user-facing == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    permissions:
      actions: read
      contents: read
    needs:
      - fingerprint
      - native-e2e-ios-light
      - ui-screenshots-ios-dark
      - android-e2e-light
      - ui-screenshots-android-dark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-node-pnpm
      - name: Compare base and head screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/gather-pr-media.sh "$GITHUB_RUN_ID" "$(scripts/measured-base.sh pull_request)" \
            "$HEAD_SHA" "$RUNNER_TEMP/pr-media"
          cat "$RUNNER_TEMP/pr-media/review.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-media-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pr-media
          if-no-files-found: error
          retention-days: 14
