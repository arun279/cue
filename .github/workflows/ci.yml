name: CI
on:
  push:
    # release/* branches run CI on push because the release gate ships a commit
    # only once ci.yml's checks are green for that exact SHA, and it reads a
    # push-event run. Without this, dispatching mobile-release.yml on a release
    # branch waits out its deadline on checks that would never report.
    branches: [main, "release/*"]
  pull_request:
  schedule:
    # Weekly re-run so the (non-deterministic) advisory audit catches newly
    # disclosed CVEs against the pinned lockfile without gating everyday commits.
    - cron: "0 6 * * 1"
permissions:
  contents: read
# github.ref is refs/heads/main for every push, so consecutive main pushes
# shared one group and cancelled each other. Four pushes in 41 seconds left only
# the first and last running. PR refs use refs/pull/N/merge and were not part of
# the main collision. Scope PR runs to the PR number and other runs to the commit
# SHA, so only runs of the identical commit collide. Every Dependabot commit now
# runs full CI instead of coalescing a burst. The repository is public, so
# Actions minutes are free and that cost is acceptable.
# The event name is also part of the group: the weekly schedule run and a push
# landing on the same commit both resolve to the same SHA, and without the
# event name the schedule run would cancel a same-commit push run in progress.
# The ref is in the group for the same reason: a release branch cut from a main
# commit pushes that SHA a second time, and without the ref that push would
# cancel main's run and leave the commit's required checks cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm check
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm audit --prod --audit-level=high
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12 # v1.7.12
  standardrb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true
      - run: bundle exec standardrb fastlane/Fastfile fastlane/Appfile
  footprint:
    # Fork and Dependabot runs receive a read-only token.
    # Skip them because that token cannot post comments.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Measure the diff footprint
        run: scripts/diff-footprint.sh "origin/${{ github.base_ref }}" > footprint.md
      - name: Update the pull request comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          comments_url="repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
          comment_ids=$(gh api --paginate "$comments_url" --jq '.[] | select(.body | startswith("<!-- diff-footprint -->")) | .id')
          # Recreate rather than edit: GitHub keeps a comment's displayed
          # timestamp at creation time forever, so an edited comment reads as
          # stale no matter how fresh its body is. Deleting and reposting keeps
          # one comment whose timestamp is always the run that produced it.
          for comment_id in $comment_ids; do
            gh api --method DELETE "repos/${{ github.repository }}/issues/comments/$comment_id"
          done
          gh api --method POST "$comments_url" -F body=@footprint.md
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm build
      - run: pnpm exec cap sync android
      # The version properties must reach the APK, otherwise every release ships
      # as the placeholder 1.0 (1) and testers stop getting updates. The same
      # read pins the merged permission set, which no repo file can be checked
      # for: any dependency's manifest can add to it.
      - name: Build the debug APK and check what it declares
        working-directory: android
        run: |
          ./gradlew assembleDebug -PcueVersionCode=42 -PcueVersionName=9.9.9
          ../scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk 42 9.9.9
  ios:
    # The runner and the Xcode path are mobile-release.yml's pin, deliberately
    # repeated: this job exists to compile what that one archives, so the two
    # have to stay on one toolchain. Read the reasoning there before changing
    # either.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm build
      - run: pnpm exec cap sync ios
      # The App target's own Swift and the hand-edited pbxproj are compiled
      # nowhere else until `fastlane ios beta` tries a Release archive, which is
      # a release-day discovery. A simulator destination asks for no signing
      # material, so this runs on a fork's pull request too.
      - name: Build the app for the simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
