name: CI
on:
  # Push runs on these branches seed the native build caches that pull requests
  # read, and the release workflows require a green push run for the commit they ship.
  push:
    branches: [main, feat/expo-native, "release/*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  MAESTRO_VERSION: 2.11.0
  MAESTRO_CLI_NO_ANALYTICS: "1"
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    timeout-minutes: 19
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Locate Jest's transform cache
        id: jest-cache
        run: echo "directory=$(node -p 'require("jest-config").defaults.cacheDirectory')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.jest-cache.outputs.directory }}
          key: jest-transform-${{ runner.os }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'packages/native/babel.config.js', 'packages/native/jest.config.js') }}
      - run: pnpm check
      - name: Upload JavaScript bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cue-js-bundles
          path: packages/native/dist/
          retention-days: 30
  audit:
    timeout-minutes: 11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Audit production dependencies, gating only dependency changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: scripts/audit-dependencies.sh "$EVENT_NAME" "$PUSH_BEFORE"
  actionlint:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12 # v1.7.12
  footprint:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    needs: check
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cue-js-bundles
          path: packages/native/dist
      - name: Report the footprint on the pull request
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          COMMENTS: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
        run: |
          scripts/diff-footprint.sh "origin/$BASE_REF" packages/native/dist > footprint.md
          cat footprint.md >> "$GITHUB_STEP_SUMMARY"
          for id in $(gh api --paginate "$COMMENTS" --jq '.[] | select(.body | startswith("<!-- diff-footprint -->")) | .id'); do
            gh api --method DELETE "repos/${{ github.repository }}/issues/comments/$id"
          done
          gh api --method POST "$COMMENTS" -F body=@footprint.md
  android-e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
      EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
      EXPO_PUBLIC_CLOCK_START: "2026-10-15T00:00:00.000Z"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - id: fingerprint
        name: Fingerprint the native project
        run: echo "hash=$(pnpm --dir packages/native exec fingerprint fingerprint:generate --platform android | jq -r .hash)" >> "$GITHUB_OUTPUT"
      - id: native
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/android-build
          key: android-release-x86_64-${{ steps.fingerprint.outputs.hash }}
      - if: steps.native.outputs.cache-hit != 'true'
        name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.native.outputs.cache-hit != 'true'
        name: Build the release APK
        working-directory: packages/native
        run: |
          pnpm exec expo prebuild --platform android --clean
          (cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64)
          mkdir -p "$RUNNER_TEMP/android-build"
          cp android/app/build/outputs/apk/release/app-release.apk android/app/debug.keystore "$RUNNER_TEMP/android-build/"
      - if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/android-build
          key: ${{ steps.native.outputs.cache-primary-key }}
      - if: steps.native.outputs.cache-hit != 'true'
        run: cp "$RUNNER_TEMP/android-build/app-release.apk" "$RUNNER_TEMP/cue.apk"
      - if: steps.native.outputs.cache-hit == 'true'
        name: Repack the cached APK with this commit's JavaScript
        working-directory: packages/native
        run: >-
          pnpm exec repack-app --platform android --source-app "$RUNNER_TEMP/android-build/app-release.apk"
          --output "$RUNNER_TEMP/cue.apk" --ks "$RUNNER_TEMP/android-build/debug.keystore"
          --ks-key-alias androiddebugkey --ks-pass pass:android --ks-key-pass pass:android
      - name: Start the fake Trakt server
        run: node packages/core/test/trakt-fake/serve.ts > "$RUNNER_TEMP/trakt-fake.log" 2>&1 &
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - id: image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cache the Android emulator package
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /usr/local/lib/android/sdk/emulator
          key: ${{ runner.os }}-android-emulator-${{ steps.image.outputs.version }}
      - id: avd
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-default-x86_64-pixel_7_pro
      - if: steps.avd.outputs.cache-hit != 'true'
        name: Create the emulator snapshot
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7_pro
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Created the emulator snapshot."
      - name: Run the smoke flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7_pro
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell pm disable-user --user 0 com.android.launcher3
            adb install "$RUNNER_TEMP/cue.apk"
            adb reverse tcp:8787 tcp:8787
            maestro test .maestro/smoke --test-output-dir "$RUNNER_TEMP/maestro/screenshots" --debug-output "$RUNNER_TEMP/maestro/debug"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: android-e2e-screenshots
          path: ${{ runner.temp }}/maestro/screenshots
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-e2e-debug
          path: |
            ${{ runner.temp }}/maestro/debug
            ${{ runner.temp }}/trakt-fake.log
          retention-days: 7
  ios-e2e:
    timeout-minutes: 90
    runs-on: macos-26
    env:
      EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
      EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
      EXPO_PUBLIC_CLOCK_START: "2026-10-15T00:00:00.000Z"
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "240000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: fingerprint
        name: Fingerprint the native project
        run: echo "hash=$(pnpm --dir packages/native exec fingerprint fingerprint:generate --platform ios | jq -r .hash)" >> "$GITHUB_OUTPUT"
      - id: native
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ios-build
          key: ios-simulator-release-xcode-26.6-${{ steps.fingerprint.outputs.hash }}
      - if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ${{ runner.temp }}/ios-derived-data
          key: ios-build-${{ runner.os }}-xcode-26.6-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.native.outputs.cache-hit != 'true'
        name: Build the simulator app
        working-directory: packages/native
        run: |
          pnpm exec expo prebuild --platform ios --clean
          ../../scripts/verify-ios-privacy.sh ios/Cue/Info.plist ios/Cue/Cue.entitlements Release 127.0.0.1
          xcodebuild -workspace ios/Cue.xcworkspace -scheme Cue -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ios-derived-data" build
          mkdir -p "$RUNNER_TEMP/ios-build"
          ditto "$RUNNER_TEMP/ios-derived-data/Build/Products/Release-iphonesimulator/Cue.app" "$RUNNER_TEMP/ios-build/Cue.app"
      - if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ios-build
          key: ${{ steps.native.outputs.cache-primary-key }}
      - if: steps.native.outputs.cache-hit != 'true'
        run: ditto "$RUNNER_TEMP/ios-build/Cue.app" "$RUNNER_TEMP/Cue.app"
      - if: steps.native.outputs.cache-hit == 'true'
        name: Repack the cached app with this commit's JavaScript
        working-directory: packages/native
        run: pnpm exec repack-app --platform ios --source-app "$RUNNER_TEMP/ios-build/Cue.app" --output "$RUNNER_TEMP/Cue.app"
      - name: Start the fake Trakt server
        run: node packages/core/test/trakt-fake/serve.ts > "$RUNNER_TEMP/trakt-fake.log" 2>&1 &
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Boot the simulator and install the app
        run: |
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-$(xcrun --sdk iphonesimulator --show-sdk-version | tr . -)"
          device=$(xcrun simctl list devices available -j | jq -er --arg runtime "$runtime" '[.devices[$runtime][]? | select(.name | startswith("iPhone"))][0].udid')
          echo "Using iPhone simulator $device on $runtime"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          # apsd retries a push certificate the simulator cannot get and chronod renders widget
          # timelines; with both running, the first launch took 54 to 93 s instead of 5 to 10 s.
          for daemon in com.apple.apsd com.apple.chronod; do
            xcrun simctl spawn "$device" launchctl disable "system/$daemon"
            xcrun simctl spawn "$device" launchctl bootout "system/$daemon"
          done
          xcrun simctl install "$device" "$RUNNER_TEMP/Cue.app"
          echo "DEVICE_ID=$device" >> "$GITHUB_ENV"
      - name: Run the smoke flows
        # One clean re-run, as EAS Maestro jobs offer with retries: 1: the simulator
        # occasionally cancels a synthesized tap, and a real defect fails both runs.
        run: |
          maestro --device "$DEVICE_ID" test .maestro/smoke --test-output-dir "$RUNNER_TEMP/maestro/screenshots" --debug-output "$RUNNER_TEMP/maestro/debug" && exit 0
          echo "::warning::The iOS smoke suite failed once; running it again from a reset fake and a fresh install."
          curl -fsS -X POST http://127.0.0.1:8787/__reset
          xcrun simctl uninstall "$DEVICE_ID" app.cuetracker
          xcrun simctl install "$DEVICE_ID" "$RUNNER_TEMP/Cue.app"
          maestro --device "$DEVICE_ID" test .maestro/smoke --test-output-dir "$RUNNER_TEMP/maestro/screenshots-rerun" --debug-output "$RUNNER_TEMP/maestro/debug-rerun"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ios-e2e-screenshots
          path: ${{ runner.temp }}/maestro/screenshots*
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ios-e2e-debug
          path: |
            ${{ runner.temp }}/maestro/debug*
            ${{ runner.temp }}/trakt-fake.log
          if-no-files-found: ignore
          retention-days: 7
