      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: native-e2e-ios-dark
          path: |
            ${{ runner.temp }}/maestro-debug/
            ${{ runner.temp }}/maestro-results-*.xml
            ${{ runner.temp }}/mock-trakt.log
