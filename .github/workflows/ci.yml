name: CI
on:
  push:
    # release/* branches run CI on push because the release gate ships a commit
    # only once ci.yml's checks are green for that exact SHA, and it reads a
    # push-event run. Without this, dispatching mobile-release.yml on a release
    # branch waits out its deadline on checks that would never report.
    branches: [main, feat/expo-native, "release/*"]
  pull_request:
  schedule:
    # Weekly re-run so the (non-deterministic) advisory audit catches newly
    # disclosed CVEs against the pinned lockfile without gating everyday commits.
    - cron: "0 6 * * 1"
permissions:
  contents: read
# github.ref is refs/heads/main for every push, so consecutive main pushes
# shared one group and cancelled each other. Four pushes in 41 seconds left only
# the first and last running. PR refs use refs/pull/N/merge and were not part of
# the main collision. Scope PR runs to the PR number and other runs to the commit
# SHA, so only runs of the identical commit collide. Every Dependabot commit now
# runs full CI instead of coalescing a burst. The repository is public, so
# Actions minutes are free and that cost is acceptable.
# The event name is also part of the group: the weekly schedule run and a push
# landing on the same commit both resolve to the same SHA, and without the
# event name the schedule run would cancel a same-commit push run in progress.
# The ref is in the group for the same reason: a release branch cut from a main
# commit pushes that SHA a second time, and without the ref that push would
# cancel main's run and leave the commit's required checks cancelled.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  fingerprint:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.native.outputs.android }}
      ios: ${{ steps.native.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - id: native
        name: Compute native fingerprints
        env:
          ANDROID_ARCHITECTURES: arm64-v8a,x86_64
          APP_VERSION: 9.9.9
          BUILD_NUMBER: "42"
          CONFIGURATION: Release
          EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
          XCODE_PATH: /Applications/Xcode_26.6.app
        run: |
          echo "android=$(node scripts/native-fingerprint.mjs android)" >> "$GITHUB_OUTPUT"
          echo "ios=$(node scripts/native-fingerprint.mjs ios)" >> "$GITHUB_OUTPUT"
  check:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm check
        env:
          EXPO_ATLAS: "true"
      - name: Gate changed core coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq .body)
          node scripts/check-changed-coverage.mjs "origin/$BASE_REF" coverage/lcov.info "$PR_BODY"
      - name: Upload JavaScript bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cue-js-bundles
          path: |
            packages/native/.expo/atlas.jsonl
            packages/native/dist/
          retention-days: 30
  render-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - name: Measure base and head consecutively
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EXPO_PUBLIC_TRAKT_CLIENT_ID: test-client
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          base_directory="$RUNNER_TEMP/render-base"
          git worktree add --detach "$base_directory" "$BASE_SHA"
          pnpm --dir "$base_directory" install --frozen-lockfile
          (cd "$base_directory" && pnpm --dir packages/native perf:render --baseline --compare=false)
          mkdir -p packages/native/.reassure
          cp "$base_directory/packages/native/.reassure/baseline.perf" \
            packages/native/.reassure/baseline.perf
          pnpm --dir packages/native perf:render
      - name: Gate render counts
        run: pnpm check:render-counts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: reassure-render-performance
          path: packages/native/.reassure/
          include-hidden-files: true
          retention-days: 7
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm audit --prod --audit-level=high
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12 # v1.7.12
  standardrb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true
      - run: bundle exec standardrb fastlane/Fastfile fastlane/Appfile
  footprint:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/expo-native'))
    permissions:
      actions: read
      contents: read
      pull-requests: write
    needs: [check, native-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cue-js-bundles
          path: packages/native
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cue-native-android-sizes
          path: ${{ runner.temp }}/native-android-sizes
      - name: Restore the base measurement
        if: github.event_name == 'pull_request'
        env:
          ARTIFACT_NAME: cue-footprint-${{ github.event.pull_request.base.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if scripts/download-ci-artifact.sh "$ARTIFACT_NAME" "$RUNNER_TEMP/base-metrics" footprint; then
            cp "$RUNNER_TEMP/base-metrics/head-metrics.json" base-metrics.json
            echo "::notice::Restored merge-base measurements from $ARTIFACT_NAME"
          else
            run_id=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$BASE_SHA&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty')
            if [ -z "$run_id" ]; then
              echo "::error::Missing merge-base measurements and successful CI artifacts for $BASE_SHA"
              exit 1
            fi
            gh run download "$run_id" --repo "${{ github.repository }}" \
              --name cue-js-bundles --dir "$RUNNER_TEMP/base-native"
            if gh run download "$run_id" --repo "${{ github.repository }}" \
              --name cue-native-android-sizes --dir "$RUNNER_TEMP/base-android"; then
              cp "$RUNNER_TEMP/base-android/head-android-sizes.json" \
                "$RUNNER_TEMP/base-android-sizes.json"
            else
              android_artifact=$(gh api \
                "repos/${{ github.repository }}/actions/runs/$run_id/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.expired | not) | .name | select(startswith("cue-native-android-") and . != "cue-native-android-sizes")' | head -n 1)
              if [ -z "$android_artifact" ]; then
                echo "::error::Missing Android artifacts for merge base $BASE_SHA"
                exit 1
              fi
              gh run download "$run_id" --repo "${{ github.repository }}" \
                --name "$android_artifact" --dir "$RUNNER_TEMP/base-android"
              curl --fail --location --retry 3 \
                --output "$RUNNER_TEMP/bundletool.jar" \
                https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
              echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
              echo '{"supportedAbis":["arm64-v8a"],"supportedLocales":["en"],"screenDensity":640,"sdkVersion":35}' \
                > "$RUNNER_TEMP/base-android/device.json"
              java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
                --bundle="$RUNNER_TEMP/base-android/app-release.aab" \
                --output="$RUNNER_TEMP/base-android/all.apks" --overwrite
              java -jar "$RUNNER_TEMP/bundletool.jar" get-size total \
                --apks="$RUNNER_TEMP/base-android/all.apks" \
                --device-spec="$RUNNER_TEMP/base-android/device.json" \
                > "$RUNNER_TEMP/base-android/play-size.csv"
              tester_size=$(wc -c < "$RUNNER_TEMP/base-android/tester-arm64-v8a.apk" | tr -d ' ')
              play_size=$(node scripts/bundletool-size.mjs \
                "$RUNNER_TEMP/base-android/play-size.csv" --value-only)
              jq -n --argjson tester "$tester_size" --argjson play "$play_size" \
                '[{name: "Firebase tester APK file", size: $tester}, {name: "Play download estimate", size: $play}]' \
                > "$RUNNER_TEMP/base-android-sizes.json"
            fi
            scripts/measure-sizes.sh "$RUNNER_TEMP/base-native" "$RUNNER_TEMP/base-js-sizes.json"
            jq -s 'add' "$RUNNER_TEMP/base-js-sizes.json" \
              "$RUNNER_TEMP/base-android-sizes.json" > "$RUNNER_TEMP/base-sizes.json"
            jq -n --slurpfile sizes "$RUNNER_TEMP/base-sizes.json" \
              '{sizes: $sizes[0]}' > base-metrics.json
            echo "::notice::Measured merge base $BASE_SHA from CI run $run_id artifacts"
          fi
      - name: Measure delivered artifacts
        run: |
          scripts/measure-sizes.sh packages/native "$PWD/head-sizes.json"
          jq -s 'add' head-sizes.json \
            "$RUNNER_TEMP/native-android-sizes/head-android-sizes.json" > all-head-sizes.json
          mv all-head-sizes.json head-sizes.json
          jq -n --slurpfile sizes head-sizes.json '{sizes: $sizes[0]}' > head-metrics.json
      - name: Measure the diff footprint
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq .body)
          export PR_BODY
          scripts/diff-footprint.sh "origin/$BASE_REF" base-metrics.json head-metrics.json \
            > footprint.md
      - name: Upload Expo Atlas
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expo-atlas
          path: packages/native/.expo/atlas.jsonl
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cue-footprint-${{ github.event.pull_request.head.sha || github.sha }}
          path: head-metrics.json
          retention-days: 30
      - name: Update the pull request comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          comments_url="repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
          comment_ids=$(gh api --paginate "$comments_url" --jq '.[] | select(.body | startswith("<!-- diff-footprint -->")) | .id')
          for comment_id in $comment_ids; do
            gh api --method DELETE "repos/${{ github.repository }}/issues/comments/$comment_id"
          done
          gh api --method POST "$comments_url" -F body=@footprint.md
      - name: Check size deltas
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq .body)
          node scripts/check-size-delta.mjs base-metrics.json head-metrics.json "$PR_BODY"
  native-ios:
    permissions:
      actions: read
      contents: read
    needs: fingerprint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: ./.github/actions/setup-node-pnpm
      - id: native-cache
        name: Restore the fingerprinted simulator app
        env:
          ARTIFACT_NAME: cue-native-ios-${{ needs.fingerprint.outputs.ios }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if scripts/download-ci-artifact.sh "$ARTIFACT_NAME" "$RUNNER_TEMP/native-ios-app" native-ios; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            tar -xzf "$RUNNER_TEMP/native-ios-app/Cue.app.tgz" -C "$RUNNER_TEMP/native-ios-app"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.native-cache.outputs.hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ${{ runner.temp }}/native-ios-derived-data
          key: ios-build-${{ runner.os }}-xcode-26.6-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.native-cache.outputs.hit != 'true'
        run: pnpm --filter @cue/native exec expo prebuild --platform ios --clean --no-install
        env:
          CONFIGURATION: Release
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
      - if: steps.native-cache.outputs.hit != 'true'
        name: Check the generated iOS privacy configuration
        run: scripts/verify-ios-privacy.sh packages/native/ios/Cue/Info.plist packages/native/ios/Cue/Cue.entitlements Release
      - if: steps.native-cache.outputs.hit != 'true'
        run: pnpm --filter @cue/native exec expo prebuild --platform ios --clean
        env:
          CONFIGURATION: Release
          EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
      - if: steps.native-cache.outputs.hit != 'true'
        name: Check the harness transport exception
        run: scripts/verify-ios-privacy.sh packages/native/ios/Cue/Info.plist packages/native/ios/Cue/Cue.entitlements Release 127.0.0.1
      - if: steps.native-cache.outputs.hit != 'true'
        name: Build the app for the simulator
        working-directory: packages/native/ios
        env:
          EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
        run: |
          xcodebuild -workspace Cue.xcworkspace -scheme Cue \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/native-ios-derived-data" build
          mkdir -p "$RUNNER_TEMP/native-ios-app"
          ditto "$RUNNER_TEMP/native-ios-derived-data/Build/Products/Release-iphonesimulator/Cue.app" \
            "$RUNNER_TEMP/native-ios-app/Cue.app"
      - if: steps.native-cache.outputs.hit == 'true'
        name: Embed current JavaScript and assets
        env:
          EXPO_PUBLIC_TRAKT_API_BASE: http://127.0.0.1:8787
          EXPO_PUBLIC_TRAKT_CLIENT_ID: ci
        run: scripts/reembed-ios.sh "$RUNNER_TEMP/native-ios-app/Cue.app"
      - name: Validate and package the simulator app
        run: |
          app="$RUNNER_TEMP/native-ios-app/Cue.app"
          LC_ALL=C grep -aq 'http://127.0.0.1:8787' "$app/main.jsbundle"
          LC_ALL=C grep -aq 'application-identifier' "$app/Cue"
          while IFS= read -r framework; do
            test -d "$app/Frameworks/$framework" || {
              echo "Missing embedded framework: $framework" >&2
              exit 1
            }
          done < <(
            {
              otool -L "$app/Cue"
              for bundle in "$app"/Frameworks/*.framework; do
                executable=${bundle##*/}
                otool -L "$bundle/${executable%.framework}"
              done
            } | awk '$1 ~ /^@rpath\/.*\.framework\// { split($1, path, "/"); print path[2] }' | sort -u
          )
          tar -czf "$RUNNER_TEMP/native-ios-app/Cue.app.tgz" -C "$RUNNER_TEMP/native-ios-app" Cue.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cue-native-ios-${{ needs.fingerprint.outputs.ios }}
          path: ${{ runner.temp }}/native-ios-app/Cue.app.tgz
          retention-days: 30
  native-e2e-ios-light:
    timeout-minutes: 14
    permissions:
      actions: read
      contents: read
    needs: [fingerprint, native-ios]
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        suite: [detail, discovery]
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cue-native-ios-${{ needs.fingerprint.outputs.ios }}
          path: ${{ runner.temp }}/native-ios-app
      - id: ui-setup
        name: Prepare the simulator and cached app
        run: scripts/prepare-ios-ui.sh "$RUNNER_TEMP/native-ios-app"
      - name: Run the shared light flow
        env:
          DEVICE_ID: ${{ steps.ui-setup.outputs.device_id }}
          APP_IDLE_CEILING_MS: "1000"
        run: |
          output="$RUNNER_TEMP/screenshots/ios/light/${{ matrix.suite }}"
          mkdir -p "$output"
          xcrun simctl ui "$DEVICE_ID" content_size medium
          xcrun simctl ui "$DEVICE_ID" appearance light
          maestro --device "$DEVICE_ID" test ".maestro/ci/app-${{ matrix.suite }}.yaml" \
            --env APP_IDLE_CEILING_MS="$APP_IDLE_CEILING_MS" \
            --format JUNIT \
            --output "$RUNNER_TEMP/maestro-results-${{ matrix.suite }}.xml" \
            --debug-output "$RUNNER_TEMP/maestro-debug/${{ matrix.suite }}" \
            --test-output-dir "$output"
      - name: Gate and summarize response timing
        if: ${{ !cancelled() && matrix.suite == 'detail' }}
        env:
          FEEDBACK_CEILING_MS: "100"
        run: |
          node scripts/check-response-timing.mjs \
            "$RUNNER_TEMP/screenshots/ios/light/detail" \
            "$FEEDBACK_CEILING_MS" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Gate and summarize app idle
        if: ${{ !cancelled() && matrix.suite == 'discovery' }}
        env:
          APP_IDLE_CEILING_MS: "1000"
        run: |
          node scripts/summarize-app-idle.mjs \
            "$RUNNER_TEMP/screenshots/ios/light/discovery" \
            "$APP_IDLE_CEILING_MS" \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: ui-screenshots-ios-light-${{ matrix.suite }}
          path: ${{ runner.temp }}/screenshots/ios/light/${{ matrix.suite }}
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: native-e2e-ios-light-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/maestro-debug/
            ${{ runner.temp }}/maestro-results-*.xml
            ${{ runner.temp }}/mock-trakt.log
          retention-days: 7
  native-e2e:
    permissions:
      actions: read
      contents: read
    needs: native-e2e-ios-light
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: ui-screenshots-ios-light-*
          path: ${{ runner.temp }}/screenshots/ios/light
          merge-multiple: true
      - name: Create iOS contact sheet
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y imagemagick
          scripts/create-ui-contact-sheet.sh "$RUNNER_TEMP/screenshots/ios/light" ios light
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-screenshots-ios-light
          path: ${{ runner.temp }}/screenshots/ios/light
          if-no-files-found: error
          retention-days: 14
  ui-screenshots-ios-dark:
    timeout-minutes: 14
    permissions:
      actions: read
      contents: read
    needs: [fingerprint, native-ios]
    runs-on: macos-26
    env:
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cue-native-ios-${{ needs.fingerprint.outputs.ios }}
          path: ${{ runner.temp }}/native-ios-app
      - id: ui-setup
        name: Prepare the simulator and cached app
        run: scripts/prepare-ios-ui.sh "$RUNNER_TEMP/native-ios-app"
      - name: Run the shared dark traversal
        env:
          DEVICE_ID: ${{ steps.ui-setup.outputs.device_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/screenshots/ios/dark"
          xcrun simctl ui "$DEVICE_ID" content_size medium
          xcrun simctl ui "$DEVICE_ID" appearance dark
          maestro --device "$DEVICE_ID" test .maestro/ci/screenshots.yaml \
            --format JUNIT \
            --output "$RUNNER_TEMP/maestro-results-dark.xml" \
            --debug-output "$RUNNER_TEMP/maestro-debug/dark" \
            --test-output-dir "$RUNNER_TEMP/screenshots/ios/dark"
      - name: Create iOS contact sheet
